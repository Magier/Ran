apiVersion: v1
kind: Namespace
metadata:
  name: room-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: noob
  namespace: room-1
  labels:
    type: noob
spec:
  replicas: 1
  selector:
    matchLabels:
      type: noob
  template:
    metadata:
      labels:
        type: noob
    spec:
      serviceAccountName: noob-sa
      containers:
        - name: noob
          image: nginx:latest
          command: ["/bin/sh", "-c", "--"]
          args: ["while true; do sleep 30; done;"]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noob-sa
  namespace: room-1
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-proxy-reader
rules:
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["nodes/pods"]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noob-binding
subjects:
- kind: ServiceAccount
  name: noob-sa
  namespace: room-1
roleRef:
  kind: ClusterRole
  name: node-proxy-reader
  apiGroup: rbac.authorization.k8s.io