apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n

  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: n8n
          image: n8nio/n8n:2.2.1
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: 0.0.0.0
            # - name: N8N_PORT
            #   value: "5678"
            # - name: WEBHOOK_TUNNEL_URL
            #   value: "http://<node-ip>:30080"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: DB_TYPE
              value: sqlite
            - name: DB_SQLITE_DATABASE
              value: /home/node/.n8n/database.sqlite
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-data
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: n8n-pv
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /tmp/n8n-data
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-service
  namespace: n8n
spec:
  type: NodePort
  selector:
    app: n8n
  ports:
    - port: 80
      targetPort: 5678
      nodePort: 30080
