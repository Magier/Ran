apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-manager
  namespace: shipping
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/exec
      - pods/log
    verbs:
      - get
      - create
  - apiGroups:
      - "apps"
    resources:
      - "deployments"
    verbs:
      - "get"
      - "list"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-manages-pods
  namespace: shipping
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-manager
subjects:
  - kind: ServiceAccount
    name: orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator
  namespace: shipping
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: orchestrator
  name: orchestrator
  namespace: shipping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  strategy: {}
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - image: curlimages/curl:latest
          name: orchestrator
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: 
              type: RuntimeDefault
      serviceAccount: orchestrator
