apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rbac-manager
rules:
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - roles
      - rolebindings
    verbs:
      - get
      - list
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: maintenance-manages-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rbac-manager
subjects:
  - kind: ServiceAccount
    name: maintenance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: maintenance
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app: maintenance
  name: maintenance
spec:
  template:
    metadata:
      labels:
        app: maintenance
    spec:
      serviceAccountName: maintenance
      restartPolicy: Never
      containers:
        - image: busybox:latest
          name: maintenance
          command: [date]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile: 
              type: RuntimeDefault
