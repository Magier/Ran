openapi: 3.0.3
info:
  title: Ran API
  description: Red team automation and attack campaign management API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /api/graph:
    get:
      summary: Get attack graph
      description: Returns the current attack graph with nodes and edges
      operationId: getGraph
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'

  /api/campaign-state:
    get:
      summary: Get campaign state
      description: Returns the current campaign state with entities and relations
      operationId: getCampaignState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignState'

  /api/armory:
    get:
      summary: Get armory
      description: Returns all available TTPs (Tactics, Techniques, and Procedures). Optionally filter by tactic.
      operationId: getArmory
      parameters:
        - name: tactic
          in: query
          required: false
          schema:
            type: string
          description: Optional tactic to filter by (e.g., "Execution", "CredentialAccess")
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TTP'

  /api/applicable-ttps:
    get:
      summary: Get applicable TTPs for a target
      description: Returns TTPs that can be applied to the specified target. If targetId is omitted or empty, returns TTPs for all targets.
      operationId: getApplicableTTPs
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: ID of the target entity (optional, can be empty for all targets)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TTP'
        '404':
          description: Target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recommendations:
    get:
      summary: Rank recommended next actions
      description: >-
        Returns applicable (TTP × target) actions ranked by utility for the
        current campaign state, using the default scoring profile. Advisory only
        — the caller decides what to execute. Each candidate includes a
        per-consideration breakdown for explainability.
      operationId: getRecommendations
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: Optional — restrict recommendations to a single target entity.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Optional — cap the number of ranked candidates returned.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredCandidate'

  /api/scoring/profile:
    get:
      summary: Get the live scoring profile
      description: >-
        Returns the current scoring profile — combination mode, the tuning
        feature flag, and every registered consideration's weight, response
        curve, and enabled/veto flags.
      operationId: getScoringProfile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
    put:
      summary: Update the live scoring profile
      description: >-
        Replace the live scoring profile (runtime tuning). Gated on the
        scoring.tuning_ui feature flag; returns 403 when disabled.
      operationId: updateScoringProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scoring/profile/save:
    post:
      summary: Persist the live scoring profile
      description: >-
        Writes the live scoring profile to its sidecar file (ran.scoring.yaml)
        so it survives restarts. Gated on the scoring.tuning_ui flag.
      operationId: saveScoringProfile
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scoring/profile/reset:
    post:
      summary: Reset the live scoring profile
      description: >-
        Reverts the live scoring profile to the configured base and removes any
        persisted overrides. Gated on the scoring.tuning_ui flag.
      operationId: resetScoringProfile
      responses:
        '200':
          description: Reset profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flow:
    get:
      summary: Get attack flow
      description: Returns the attack flow with steps and edges
      operationId: getFlow
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackFlow'

  /api/flow/export:
    get:
      summary: Export attack flow
      description: Returns the attack flow in MITRE ATT&CK Flow format
      operationId: exportAttackFlow
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Export failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flow/save:
    post:
      summary: Save attack flow
      description: Save the attack flow to a file
      operationId: saveFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - path
              properties:
                path:
                  type: string
                  description: File path to save the flow
      responses:
        '200':
          description: Successfully saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/action/execute:
    post:
      summary: Execute action
      description: Execute a TTP action on a target. The action will be queued and executed asynchronously. The final execution status will be sent via SSE.
      operationId: executeAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteActionCmd'
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '202':
          description: Action queued for execution, pending asynchronous processing. The final status will be sent via SSE.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  taskId:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified action or target was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The action was executed, but failed for some reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaign/reset:
    post:
      summary: Reset campaign
      description: Reset the current campaign state
      operationId: resetCampaign
      responses:
        '200':
          description: Campaign reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pods/running:
    get:
      summary: Get running pods
      description: Returns list of running pods in the specified namespace
      operationId: getRunningPods
      parameters:
        - name: namespace
          in: query
          required: false
          schema:
            type: string
          description: Kubernetes namespace (optional, defaults to all namespaces)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/K8sResource'
        '500':
          description: Failed to retrieve pods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pods/watch:
    post:
      summary: Start watching pods
      description: Starts a real-time watch on pods. Pod state changes will be pushed via SSE as 'pods-changed' events.
      operationId: startPodWatch
      parameters:
        - name: namespace
          in: query
          required: false
          schema:
            type: string
          description: Kubernetes namespace to watch (optional, defaults to all namespaces)
      responses:
        '200':
          description: Watch started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Failed to start watch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Stop watching pods
      description: Stops the current pod watch. No more 'pods-changed' SSE events will be sent.
      operationId: stopPodWatch
      responses:
        '200':
          description: Watch stopped successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/execution-records:
    get:
      summary: Get execution records
      description: |
        Returns all execution records for the current campaign session.
        Each record includes the full raw stdout/stderr in `results`, resolved
        arguments, timing, and the parse audits produced by each declared TTP
        effect. Intended for use by Shuhari's Gap 2 scanner,
        which cross-references raw stdout against declared effects to detect
        undeclared structured output.
      operationId: getExecutionRecords
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionRecordEntry'

  /api/execution-records/{id}:
    get:
      summary: Get execution record by ID
      description: Returns a single execution record by command ID, joined with its parse audits.
      operationId: getExecutionRecordById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Command ID (matches the `id` field in SSE `ttp-executed` and `parse-audited` events)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRecordEntry'
        '404':
          description: No record found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/files:
    get:
      summary: Get file content
      description: Returns the content of a previously read file
      operationId: getFileContent
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: The file path to retrieve content for
      responses:
        '200':
          description: File content retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  content:
                    type: string
        '404':
          description: File content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

webhooks: 
  armory-loaded:
    post:
      summary: Armory loaded webhook
      description: Triggered when the armory is successfully loaded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Webhook received successfully
        '400':
          description: Invalid webhook payload

components:
  schemas:
    Graph:
      type: object
      required:
        - nodes
        - edges
        - rootNodeId
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        rootNodeId:
          type: string

    Node:
      type: object
      required:
        - id
        - name
        - kind
        - entityId
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        parent:
          type: string
        accessLevel:
          type: string
        entityId:
          type: string
        entity:
          type: object
          additionalProperties: true
        compromised:
          type: boolean
        isRunning:
          type: boolean

    Edge:
      type: object
      required:
        - id
        - name
        - sourceId
        - targetId
      properties:
        id:
          type: string
        name:
          type: string
        weight:
          type: number
          format: float
        relation:
          type: object
          additionalProperties: true
        sourceId:
          type: string
        targetId:
          type: string
        sessionId:
          type: string
          description: Backend ID of the active persistent session on this exec-channel edge, if any.

    CampaignState:
      type: object
      required:
        - entities
        - relations
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
        relations:
          type: array
          items:
            type: object
            additionalProperties: true

    AttackFlow:
      type: object
      required:
        - steps
        - edges
        - rootNodeId
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AttackStep'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        rootNodeId:
          type: string

    AttackStep:
      type: object
      required:
        - id
        - actionId
        - targetId
        - command
        - TTP
        - procedureId
        - executedOn
        - args
        - timestamp
        - status
        - observables
        - results
        - startedAt
        - completedAt
      properties:
        id:
          type: string
        targetId:
          type: string
        command:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
        procedureId:
          type: string
        TTP: 
          $ref: '#/components/schemas/TTP'
        results:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        executedOn:
          type: string
        status:
          type: string
          enum:
            - Unknown
            - Failed
            - Success
            - Ongoing
        observables:
          type: array
          items:
            type: string
        defense:
          $ref: '#/components/schemas/TTPDefense'

    TTP:
      type: object
      required:
        - id
        - name
        - description
        - tactic
        - techniques
        - requires
        - procedures
        - params
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tactic:
          type: string
        techniques:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/TTPStatus'
        params:
          type: array
          items:
            $ref: '#/components/schemas/TTPParam'
        requires:
          $ref: '#/components/schemas/Requirements'
        effects:
          type: array
          items:
            type: string
        procedures:
          type: array
          items:
            $ref: '#/components/schemas/Procedure'
        # defense:
        #   $ref: '#/components/schemas/TTPDefense'

    Procedure:
      type: object
      required:
        - id
        - command
      properties:
        id:
          type: string
        command:
          type: string
        tool:
          type: string
        isLocalCommand:
          type: boolean

    TTPParam:
      type: object
      required:
        - name
        - type
        - required
        - description
        - default
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        required:
          type: boolean
        default:
          type: string
    
    TTPDefense:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        description: 
          type: string
        sigma:
          $ref: '#/components/schemas/SigmaRule'
        d3efend:
          type: string
        
    SigmaRule:
      type: object
      required:
        - title
        - tags
        - logsource
        - detection
        - date
      properties:
        title:
          type: string
        id:
          type: string
        description:
          type: string  
        status:
          type: string
        logsource:
          type: object
          additionalProperties: true
        detection:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        date:
          type: string
          format: date-time

    ExecuteActionCmd:
      type: object
      required:
        - actionId
        - targetId
      properties:
        actionId:
          type: string
        execSystemId:
          type: string
        targetId:
          type: string
        procedureId:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
        reasoning:
          type: string
          description: >
            Free-text rationale for choosing this action at this point in the
            assessment — why this TTP against this target now. Optional, but
            strongly encouraged when driving the campaign programmatically: it
            is stored on the resulting execution record so the timeline is
            self-explaining and auditable.

    K8sResource:
      type: object
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        kind:
          type: string
        phase:
          type: string
          description: Pod phase (Running, Pending, Succeeded, Failed, Unknown)
        ready:
          type: boolean
          description: Whether all containers in the pod are ready
        stateReason:
          type: string
          description: Container-level state reason (e.g. CrashLoopBackOff, ImagePullBackOff)
    
    Requirements:
      type: object
      properties:
        kind:
          type: string
        rbacPermissions:
          type: array
          items:
            $ref: '#/components/schemas/RBACPermission'
        accessLevel:
          type: string
        exists:
          type: array
          items:
            type: string

    RBACPermission:
      type: object
      required:
        - apiGroup
        - verb
        - resource
        - resourceName
        - resourceType
        - scope
        - sourceRole
        - isNamespaced
      properties:
        resource:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        apiGroup:
          type: string
        verb:
          type: string
        scope:
          type: string
        sourceRole:
          type: string
        isNamespaced:
          type: boolean
          default: true
    ExecutionRecordEntry:
      type: object
      description: |
        A completed TTP execution joined with the parse audits produced by its
        declared effects. The record fields are flattened at the top level;
        `parseAudits` is the list of per-effect audit entries.
      required:
        - id
        - ttp_id
        - ttp_name
        - tactic
        - target_id
        - exec_system_id
        - procedure_id
        - command
        - args
        - success
        - exit_code
        - results
        - fail_reason
        - started_at_ms
        - completed_at_ms
        - parseAudits
      properties:
        id:
          type: string
          description: Unique command ID, correlates with SSE `ttp-executed` and `parse-audited` events
        ttp_id:
          type: string
        ttp_name:
          type: string
        tactic:
          type: string
        target_id:
          type: string
        exec_system_id:
          type: string
          description: ID of the system that ran the command; empty for direct builtin exec
        procedure_id:
          type: string
        command:
          type: string
          description: Fully grounded command string sent to the C2 backend
        args:
          type: object
          additionalProperties:
            type: string
          description: Resolved arguments after default-filling and template substitution
        success:
          type: boolean
        exit_code:
          type: integer
        results:
          type: array
          items:
            type: string
          description: Raw output lines — first element is stdout, second (if present) is stderr
        fail_reason:
          type: string
        started_at_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the command was dispatched
        completed_at_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the result was received
        reasoning:
          type: string
          description: >
            Caller-supplied rationale for why this action was run, as passed to
            the execute-action request. Empty when none was given.
        parseAudits:
          type: array
          items:
            $ref: '#/components/schemas/ParseAudit'

    ParseAudit:
      type: object
      description: |
        Audit record for a single effect parse attempt. `parse_result` indicates
        whether the effect was parsed successfully; `NoParser` and `UnknownFormat`
        are the two signals used by Shuhari's Gap 1 classifier.
      required:
        - cmd_id
        - effect_id
        - ttp_id
        - target_id
        - parser_version
        - raw_output_hash
        - raw_output_preview
        - parse_result
        - detail
        - inferred_facts_written
      properties:
        cmd_id:
          type: string
          description: Command ID of the execution that produced this audit
        effect_id:
          type: string
          description: Effect identifier as declared in the TTP (e.g. `sys.envvar`, `k8s.podlist`)
        ttp_id:
          type: string
        target_id:
          type: string
        parser_version:
          type: string
        raw_output_hash:
          type: string
          description: SHA-256 of the raw stdout+stderr, for deduplication across episodes
        raw_output_preview:
          type: string
          description: First 1024 characters of combined stdout+stderr
        parse_result:
          type: string
          enum:
            - Parsed
            - KnownFailure
            - UnknownFormat
            - NoParser
            - ParserBug
          description: |
            - `Parsed`: effect was handled and facts were written to the campaign
            - `KnownFailure`: effect ran but produced expected-empty output (e.g. command not found)
            - `UnknownFormat`: output was present but the parser could not interpret it
            - `NoParser`: no compiled or external parser is registered for this effect (Gap 1 signal)
            - `ParserBug`: parser crashed or panicked
        detail:
          type: string
          description: Human-readable explanation of the parse outcome
        inferred_facts_written:
          type: integer
          description: Number of new entities or field updates written to the campaign graph

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          type: string

    ConsiderationScore:
      type: object
      description: One consideration's contribution to a candidate's utility.
      required:
        - name
        - raw
        - curved
        - weight
        - veto
      properties:
        name:
          type: string
          description: Consideration identifier (e.g. "privilege_gain").
        raw:
          type: number
          format: float
          description: Raw measurement in [0, 1].
        curved:
          type: number
          format: float
          description: Measurement after the profile's response curve.
        weight:
          type: number
          format: float
          description: Weight applied from the profile.
        veto:
          type: boolean
          description: Whether this consideration acted as a multiplicative veto.

    ScoredCandidate:
      type: object
      description: A scored, grounded (TTP × target) action.
      required:
        - ttp_id
        - target_id
        - utility
        - breakdown
      properties:
        ttp_id:
          type: string
        target_id:
          type: string
        utility:
          type: number
          format: float
          description: Final utility in [0, 1].
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ConsiderationScore'

    CombinationMode:
      type: string
      description: How per-consideration scores are combined into one utility.
      enum:
        - weighted_arithmetic
        - weighted_geometric
        - iaus_multiplicative

    ResponseCurve:
      type: object
      description: >-
        A response curve mapping a raw measurement in [0,1] to a tuned score in
        [0,1], internally tagged by `type`. Only the fields for the active type
        are meaningful (linear: slope/intercept; polynomial: exponent/slope/
        intercept; logistic: steepness/midpoint; step: threshold).
      required:
        - type
      properties:
        type:
          type: string
          enum: [linear, polynomial, logistic, step]
        slope:
          type: number
          format: float
        intercept:
          type: number
          format: float
        exponent:
          type: number
          format: float
        steepness:
          type: number
          format: float
        midpoint:
          type: number
          format: float
        threshold:
          type: number
          format: float

    NamedConsideration:
      type: object
      description: A consideration's tunable config, tagged with its name.
      required:
        - name
        - weight
        - curve
        - enabled
        - veto
      properties:
        name:
          type: string
        weight:
          type: number
          format: float
        curve:
          $ref: '#/components/schemas/ResponseCurve'
        enabled:
          type: boolean
        veto:
          type: boolean

    ScoringProfile:
      type: object
      description: The live scoring profile.
      required:
        - combination
        - tuningEnabled
        - considerations
      properties:
        combination:
          $ref: '#/components/schemas/CombinationMode'
        tuningEnabled:
          type: boolean
          description: Whether the tuning UI feature flag is enabled.
        considerations:
          type: array
          items:
            $ref: '#/components/schemas/NamedConsideration'

    ScoringProfileUpdate:
      type: object
      description: A scoring-profile update (runtime tuning).
      required:
        - combination
        - considerations
      properties:
        combination:
          $ref: '#/components/schemas/CombinationMode'
        considerations:
          type: array
          items:
            $ref: '#/components/schemas/NamedConsideration'

    OwnerRef:
      type: object
      description: Reference to the Kubernetes owner of a resource (e.g. ReplicaSet → Pod).
      required:
        - name
        - kind
        - uid
      properties:
        name:
          type: string
        kind:
          type: string
        uid:
          type: string

    VolumeMount:
      type: object
      description: A volume mount on a pod — either a projected volume or a host-path bind mount.
      required:
        - name
        - mount_point
        - mount_root
        - read_only
        - is_host_path
      properties:
        name:
          type: string
        mount_point:
          type: string
          description: Path inside the container where the volume appears.
        mount_root:
          type: string
          description: Path on the host that is bound (for hostPath mounts).
        mount_type:
          type: string
        read_only:
          type: boolean
        is_host_path:
          type: boolean

    TTPStatus:
      type: string
      enum:
        - enabled
        - disabled
      description: Status of a TTP - whether it is enabled or disabled
