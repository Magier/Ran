openapi: 3.0.3
info:
  title: Ran API
  description: Red team automation and attack campaign management API
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Development server

paths:
  /api/graph:
    get:
      summary: Get attack graph
      description: Returns the current attack graph with nodes and edges
      operationId: getGraph
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'

  /api/campaign-state:
    get:
      summary: Get campaign state
      description: Returns the current campaign state with entities and relations
      operationId: getCampaignState
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignState'

  /api/kubetier:
    get:
      summary: Get the offline KubeTier catalog
      description: Returns the bundled metadata snapshot or configured private/full local snapshot. This endpoint never fetches kubetier.com.
      operationId: getKubetierCatalog
      responses:
        '200':
          description: Offline KubeTier catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KubetierCatalog'

  /api/armory:
    get:
      summary: Get armory
      description: Returns all available TTPs (Tactics, Techniques, and Procedures). Optionally filter by tactic.
      operationId: getArmory
      parameters:
        - name: tactic
          in: query
          required: false
          schema:
            type: string
          description: Optional tactic to filter by (e.g., "Execution", "CredentialAccess")
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TTP'

  /api/applicable-ttps:
    get:
      summary: Get applicable TTPs for a target
      description: Returns TTPs that can be applied to the specified target. If targetId is omitted or empty, returns TTPs for all targets.
      operationId: getApplicableTTPs
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: ID of the target entity (optional, can be empty for all targets)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TTP'
        '404':
          description: Target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/eligible-auth-identities:
    get:
      summary: Get eligible Kubernetes authentication identities
      description: Returns identities satisfying the action's authentication and RBAC requirements for the selected target.
      operationId: getEligibleAuthIdentities
      parameters:
        - name: actionId
          in: query
          required: true
          schema:
            type: string
        - name: targetId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Eligible identities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthIdentity'
        '404':
          description: Action or target not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/recommendations:
    get:
      summary: Rank recommended next actions
      description: >-
        Returns applicable (TTP × target) actions ranked by utility for the
        current campaign state, using the default scoring profile. Advisory only
        — the caller decides what to execute. Each candidate includes a
        per-consideration breakdown for explainability.
      operationId: getRecommendations
      parameters:
        - name: targetId
          in: query
          required: false
          schema:
            type: string
          description: Optional — restrict recommendations to a single target entity.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Optional — cap the number of ranked candidates returned.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoredCandidate'

  /api/scoring/profile:
    get:
      summary: Get the live scoring profile
      description: >-
        Returns the current scoring profile — combination mode, the tuning
        feature flag, and every registered consideration's weight, response
        curve, and enabled/veto flags.
      operationId: getScoringProfile
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
    put:
      summary: Update the live scoring profile
      description: >-
        Replace the live scoring profile (runtime tuning). Gated on the
        scoring.tuning_ui feature flag; returns 403 when disabled.
      operationId: updateScoringProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringProfileUpdate'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scoring/profile/save:
    post:
      summary: Persist the live scoring profile
      description: >-
        Writes the live scoring profile to its sidecar file (ran.scoring.yaml)
        so it survives restarts. Gated on the scoring.tuning_ui flag.
      operationId: saveScoringProfile
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scoring/profile/reset:
    post:
      summary: Reset the live scoring profile
      description: >-
        Reverts the live scoring profile to the configured base and removes any
        persisted overrides. Gated on the scoring.tuning_ui flag.
      operationId: resetScoringProfile
      responses:
        '200':
          description: Reset profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringProfile'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/scoring/calibrate:
    post:
      summary: Calibrate the scoring profile from captured operator decisions
      description: >-
        Fit consideration weights from the operator decisions captured during
        this and prior sessions, so the utility AI reproduces those choices under
        the same conditions. Returns the fitted profile as a *preview* (not
        applied) plus fit-quality metrics; apply it via PUT /api/scoring/profile.
        Gated on the scoring.tuning_ui flag. Returns 409 if no decisions have been
        captured yet.
      operationId: calibrateScoring
      responses:
        '200':
          description: Fitted profile preview and metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalibrationResult'
        '403':
          description: Tuning disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No captured decisions to calibrate from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/flow:
    get:
      summary: Get campaign flow
      description: Returns Ran's campaign flow JSON with execution steps and causal edges
      operationId: getFlow
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackFlow'

  /api/action/execute:
    post:
      summary: Execute action
      description: >-
        Execute a TTP action on a target. The action is queued and executed
        asynchronously, with final status sent via SSE. For the initial
        valid-accounts-kubeconfig action, targetId may identify an exact ready
        Pod returned by /api/pods/running that is not yet in campaign knowledge;
        Ran stages only that Pod before execution.
      operationId: executeAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteActionCmd'
      responses:
        '200':
          description: Action executed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '202':
          description: Action queued for execution, pending asynchronous processing. The final status will be sent via SSE.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  taskId:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The specified action or target was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The action was executed, but failed for some reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaign/reset:
    post:
      summary: Reset campaign
      description: Reset the current campaign state
      operationId: resetCampaign
      responses:
        '200':
          description: Campaign reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '500':
          description: Reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/pods/running:
    get:
      summary: Get running pods
      description: Returns list of running pods in the specified namespace
      operationId: getRunningPods
      parameters:
        - name: namespace
          in: query
          required: false
          schema:
            type: string
          description: Kubernetes namespace (optional, defaults to all namespaces)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/K8sResource'
        '500':
          description: Failed to retrieve pods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/execution-records:
    get:
      summary: Get execution records
      description: |
        Returns all execution records for the current campaign session.
        Each record includes the full raw stdout/stderr in `results`, resolved
        arguments, timing, and the parse audits produced by each declared TTP
        effect. Intended for use by Shuhari's Gap 2 scanner,
        which cross-references raw stdout against declared effects to detect
        undeclared structured output.
      operationId: getExecutionRecords
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExecutionRecordEntry'

  /api/execution-records/{id}:
    get:
      summary: Get execution record by ID
      description: Returns a single execution record by command ID, joined with its parse audits.
      operationId: getExecutionRecordById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Command ID (matches the `id` field in SSE `ttp-executed` and `parse-audited` events)
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionRecordEntry'
        '404':
          description: No record found for the given ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/files:
    get:
      summary: Get file content
      description: Returns the content of a previously read file
      operationId: getFileContent
      parameters:
        - name: path
          in: query
          required: true
          schema:
            type: string
          description: The file path to retrieve content for
      responses:
        '200':
          description: File content retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  content:
                    type: string
        '404':
          description: File content not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plans/available:
    get:
      summary: List available plans
      description: Lists pre-defined plans found in the configured plans directory (ran.yaml `plans.dir`, defaulting to `plans/`).
      operationId: listPlans
      responses:
        '200':
          description: Available plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanSummary'
        '500':
          description: Failed to read the plans directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plans/load:
    post:
      summary: Load and execute a plan
      description: Reads a plan by file name from the configured plans directory and starts executing it. Returns the started plan's id.
      operationId: loadPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadPlanRequest'
      responses:
        '200':
          description: Plan started
          content:
            application/json:
              schema:
                type: object
                properties:
                  plan_id:
                    type: string
        '400':
          description: Invalid plan filename or plan failed to parse
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Plan not found in the plans directory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

webhooks:
  armory-loaded:
    post:
      summary: Armory loaded webhook
      description: Triggered when the armory is successfully loaded
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Webhook received successfully
        '400':
          description: Invalid webhook payload

components:
  schemas:
    PlanSummary:
      type: object
      required:
        - filename
        - id
        - name
        - steps
      properties:
        filename:
          type: string
          description: File name within the plans directory (pass to /api/plans/load)
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        steps:
          type: integer
          description: Number of steps in the plan
    LoadPlanRequest:
      type: object
      required:
        - filename
      properties:
        filename:
          type: string
          description: File name of the plan within the configured plans directory
    Graph:
      type: object
      required:
        - nodes
        - edges
        - rootNodeId
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/Edge'
        rootNodeId:
          type: string

    Node:
      type: object
      required:
        - id
        - name
        - kind
        - entityId
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        parent:
          type: string
        accessLevel:
          type: string
        entityId:
          type: string
        entity:
          type: object
          additionalProperties: true
        compromised:
          type: boolean
        isRunning:
          type: boolean
        provenance:
          type: array
          items:
            type: string
            enum: [scenario, operator, action, inference]

    Edge:
      type: object
      required:
        - id
        - name
        - sourceId
        - targetId
      properties:
        id:
          type: string
        name:
          type: string
        weight:
          type: number
          format: float
        relation:
          type: object
          additionalProperties: true
        sourceId:
          type: string
        targetId:
          type: string
        sessionId:
          type: string
          description: Backend ID of the active persistent session on this exec-channel edge, if any.
        provenance:
          type: array
          items:
            type: string
            enum: [scenario, operator, action, inference]

    CampaignState:
      type: object
      required:
        - entities
        - relations
      properties:
        entities:
          type: object
          additionalProperties:
            type: object
        relations:
          type: array
          items:
            type: object
            additionalProperties: true
        bootstrapOperations:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapOperation'

    BootstrapOperation:
      type: object
      required:
        - id
        - name
        - detail
        - effects
      properties:
        id:
          type: string
        name:
          type: string
        detail:
          type: string
        effects:
          type: array
          items:
            $ref: '#/components/schemas/BootstrapEffect'

    BootstrapEffect:
      type: object
      required:
        - entityId
        - entityName
        - entityKind
        - category
      properties:
        entityId:
          type: string
        entityName:
          type: string
        entityKind:
          type: string
        category:
          type: string
          enum: [credential, discovery]

    AttackFlow:
      type: object
      description: Ran's internal campaign-flow representation. This is not MITRE Attack Flow/STIX.
      required:
        - steps
        - edges
      properties:
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AttackStep'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/FlowEdge'

    FlowEdge:
      type: object
      required:
        - id
        - sourceId
        - targetId
      properties:
        id:
          type: string
        sourceId:
          type: string
        targetId:
          type: string

    AttackStep:
      type: object
      required:
        - id
        - targetId
        - command
        - traversal
        - innerCommand
        - TTP
        - procedureId
        - executedOn
        - args
        - status
        - success
        - results
        - startedAt
        - completedAt
      properties:
        id:
          type: string
        targetId:
          type: string
        command:
          type: string
        traversal:
          type: array
          description: >-
            Per-hop breakdown of a multi-system command traversal, ordered from
            the C2 entry point (outermost envelope) to the final target
            (innermost). Empty for direct/single-hop commands.
          items:
            $ref: '#/components/schemas/TraversalHop'
        innerCommand:
          type: string
          description: >-
            The bare inner command as it runs on the final target system,
            before any hop envelopes wrap it. Empty when there is no multi-hop
            traversal.
        args:
          type: object
          additionalProperties:
            type: string
        procedureId:
          type: string
        TTP:
          $ref: '#/components/schemas/AttackStepTTP'
        results:
          type: array
          items:
            type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          description: Completion timestamp in RFC 3339 format, or an empty string while ongoing
        executedOn:
          type: string
        status:
          type: string
          enum:
            - Unknown
            - Failed
            - Success
            - Ongoing
        success:
          type: boolean

    AttackStepTTP:
      type: object
      required:
        - id
        - name
        - description
        - tactic
        - techniques
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tactic:
          type: string
        techniques:
          type: array
          items:
            type: string

    TraversalHop:
      type: object
      description: >-
        One segment of a multi-hop command traversal: the command as it is
        handed from `fromId` to `toId`, and the envelope template applied at
        this layer.
      required:
        - fromId
        - toId
        - relation
        - command
      properties:
        fromId:
          type: string
          description: Entity executing this segment; the C2 backend id for the first hop.
        toId:
          type: string
          description: Entity reached by this segment.
        relation:
          type: string
          description: >-
            Relation/channel name driving this hop (e.g. `kubelet-exec`,
            `rce.can-exec`, `kubectl-exec`, or `builtin-exec` for the C2 entry).
        envelope:
          type: string
          description: >-
            The command-wrapping template with `${CMD}` placeholder applied at
            this hop. Absent for the C2 entry hop and pass-through segments.
        command:
          type: string
          description: The full command string sent across this segment — what `fromId` runs.

    TTP:
      type: object
      required:
        - id
        - name
        - description
        - tactic
        - techniques
        - requires
        - procedures
        - params
        - status
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        tactic:
          type: string
        techniques:
          type: array
          items:
            type: string
        status:
          $ref: '#/components/schemas/TTPStatus'
        params:
          type: array
          items:
            $ref: '#/components/schemas/TTPParam'
        requires:
          $ref: '#/components/schemas/Requirements'
        effects:
          type: array
          items:
            type: string
        procedures:
          type: array
          items:
            $ref: '#/components/schemas/Procedure'
        # defense:
        #   $ref: '#/components/schemas/TTPDefense'

    Procedure:
      type: object
      required:
        - id
        - command
      properties:
        id:
          type: string
        command:
          type: string
        tool:
          type: string
        isLocalCommand:
          type: boolean

    TTPParam:
      type: object
      required:
        - name
        - type
        - required
        - description
        - default
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        required:
          type: boolean
        default:
          type: string
    
    TTPDefense:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        description: 
          type: string
        sigma:
          $ref: '#/components/schemas/SigmaRule'
        d3efend:
          type: string
        
    SigmaRule:
      type: object
      required:
        - title
        - tags
        - logsource
        - detection
        - date
      properties:
        title:
          type: string
        id:
          type: string
        description:
          type: string  
        status:
          type: string
        logsource:
          type: object
          additionalProperties: true
        detection:
          type: object
          additionalProperties: true
        tags:
          type: array
          items:
            type: string
        references:
          type: array
          items:
            type: string
        date:
          type: string
          format: date-time

    ExecuteActionCmd:
      type: object
      required:
        - actionId
        - targetId
      properties:
        actionId:
          type: string
        execSystemId:
          type: string
        authIdentityId:
          type: string
          description: >
            Entity ID selected through the TTP's K8S_AUTH parameter. Required
            for Kubernetes procedures and must identify an eligible captured
            ServiceAccount or the active K8sCredential.
        targetId:
          type: string
        procedureId:
          type: string
        args:
          type: object
          additionalProperties:
            type: string
        reasoning:
          type: string
          description: >
            Free-text rationale for choosing this action at this point in the
            assessment — why this TTP against this target now. Optional, but
            strongly encouraged when driving the campaign programmatically: it
            is stored on the resulting execution record so the timeline is
            self-explaining and auditable.

    AuthIdentity:
      type: object
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string

    K8sResource:
      type: object
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        kind:
          type: string
        phase:
          type: string
          description: Pod phase (Running, Pending, Succeeded, Failed, Unknown)
        ready:
          type: boolean
          description: Whether all containers in the pod are ready
        stateReason:
          type: string
          description: Container-level state reason (e.g. CrashLoopBackOff, ImagePullBackOff)
    
    Requirements:
      type: object
      properties:
        kind:
          type: string
        rbacPermissions:
          type: array
          items:
            $ref: '#/components/schemas/RBACPermission'
        accessLevel:
          type: string
        activeSession:
          type: boolean
        exists:
          type: array
          items:
            type: string

    RBACPermission:
      type: object
      required:
        - apiGroup
        - verb
        - resource
        - resourceName
        - resourceType
        - scope
        - sourceRole
        - isNamespaced
      properties:
        resource:
          type: string
        resourceName:
          type: string
        resourceType:
          type: string
        apiGroup:
          type: string
        verb:
          type: string
        scope:
          type: string
        sourceRole:
          type: string
        isNamespaced:
          type: boolean
          default: true
        scopeKind:
          type: string
          enum: [cluster, namespace, unknown]
        evaluatedNamespace:
          type: string
        scopeSource:
          type: string
          enum: [binding, role, ssrr]
        kubetier:
          $ref: '#/components/schemas/KubetierPermissionAssessment'

    KubetierPermissionAssessment:
      type: object
      required: [provider, scopeUnverified, matches]
      properties:
        provider:
          type: string
          enum: [kubetier]
        tierMin:
          $ref: '#/components/schemas/KubetierTier'
        tierMax:
          $ref: '#/components/schemas/KubetierTier'
        unassessed:
          type: boolean
        scopeUnverified:
          type: boolean
        matches:
          type: array
          items:
            $ref: '#/components/schemas/KubetierPermission'

    KubetierTier:
      type: string
      enum: [T0, T1, T2, T3]

    KubetierScope:
      type: string
      enum: [cluster, namespaced]

    KubetierEscalationPath:
      type: object
      required: [name, tier, sourceUrl, steps]
      properties:
        name:
          type: string
        tier:
          $ref: '#/components/schemas/KubetierTier'
        sourceUrl:
          type: string
        steps:
          type: array
          items:
            type: string

    KubetierPermission:
      type: object
      required: [id, verb, resource, apiGroup, scope, tier, escalationCount, sourceUrl, escalationPaths]
      properties:
        id:
          type: string
        verb:
          type: string
        resource:
          type: string
        apiGroup:
          type: string
        scope:
          $ref: '#/components/schemas/KubetierScope'
        tier:
          $ref: '#/components/schemas/KubetierTier'
        escalationCount:
          type: integer
        sourceUrl:
          type: string
        kubernetesDocUrl:
          type: string
        description:
          type: string
        escalationPaths:
          type: array
          items:
            $ref: '#/components/schemas/KubetierEscalationPath'

    KubetierRoleRule:
      type: object
      required: [apiGroups, resources, nonResourceUrls, verbs]
      properties:
        apiGroups:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
        nonResourceUrls:
          type: array
          items:
            type: string
        verbs:
          type: array
          items:
            type: string

    KubetierRole:
      type: object
      required: [id, name, scope, tier, sourceUrl, rules, notes]
      properties:
        id:
          type: string
        name:
          type: string
        scope:
          $ref: '#/components/schemas/KubetierScope'
        tier:
          $ref: '#/components/schemas/KubetierTier'
        sourceUrl:
          type: string
        kubernetesDocUrl:
          type: string
        description:
          type: string
        notes:
          type: array
          items:
            type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/KubetierRoleRule'

    KubetierCatalog:
      type: object
      required: [schemaVersion, attribution, sourceUrl, fetchedAt, sourceSha256, full, permissions, roles]
      properties:
        schemaVersion:
          type: integer
        attribution:
          type: string
        sourceUrl:
          type: string
        fetchedAt:
          type: string
        sourceEtag:
          type: string
        sourceSha256:
          type: string
        validatedKubernetesVersion:
          type: string
        full:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/KubetierPermission'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/KubetierRole'

    ExecutionRecordEntry:
      type: object
      description: |
        A completed TTP execution joined with the parse audits produced by its
        declared effects. The record fields are flattened at the top level;
        `parseAudits` is the list of per-effect audit entries.
      required:
        - id
        - ttp_id
        - ttp_name
        - tactic
        - target_id
        - exec_system_id
        - procedure_id
        - command
        - args
        - success
        - exit_code
        - results
        - fail_reason
        - started_at_ms
        - completed_at_ms
        - discovered_entities
        - parseAudits
      properties:
        id:
          type: string
          description: Unique command ID, correlates with SSE `ttp-executed` and `parse-audited` events
        ttp_id:
          type: string
        ttp_name:
          type: string
        tactic:
          type: string
        target_id:
          type: string
        exec_system_id:
          type: string
          description: ID of the system that ran the command; empty for direct builtin exec
        auth_identity_id:
          type: string
          description: ID of the Kubernetes authentication identity selected for the action
        procedure_id:
          type: string
        command:
          type: string
          description: Fully grounded command string sent to the C2 backend
        args:
          type: object
          additionalProperties:
            type: string
          description: Resolved arguments after default-filling and template substitution
        success:
          type: boolean
        exit_code:
          type: integer
        results:
          type: array
          items:
            type: string
          description: Raw output lines — first element is stdout, second (if present) is stderr
        fail_reason:
          type: string
        started_at_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the command was dispatched
        completed_at_ms:
          type: integer
          format: int64
          description: Unix timestamp in milliseconds when the result was received
        discovered_entities:
          type: array
          description: Entities produced by this execution, retained for operation timeline replay
          items:
            $ref: '#/components/schemas/ExecutionEntity'
        reasoning:
          type: string
          description: >
            Caller-supplied rationale for why this action was run, as passed to
            the execute-action request. Empty when none was given.
        parseAudits:
          type: array
          items:
            $ref: '#/components/schemas/ParseAudit'

    ExecutionEntity:
      type: object
      required:
        - id
        - name
        - kind
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string

    ParseAudit:
      type: object
      description: |
        Audit record for a single effect parse attempt. `parse_result` indicates
        whether the effect was parsed successfully; `NoParser` and `UnknownFormat`
        are the two signals used by Shuhari's Gap 1 classifier.
      required:
        - cmd_id
        - effect_id
        - ttp_id
        - target_id
        - parser_version
        - raw_output_hash
        - raw_output_preview
        - parse_result
        - detail
        - inferred_facts_written
      properties:
        cmd_id:
          type: string
          description: Command ID of the execution that produced this audit
        effect_id:
          type: string
          description: Effect identifier as declared in the TTP (e.g. `sys.envvar`, `k8s.podlist`)
        ttp_id:
          type: string
        target_id:
          type: string
        parser_version:
          type: string
        raw_output_hash:
          type: string
          description: SHA-256 of the raw stdout+stderr, for deduplication across episodes
        raw_output_preview:
          type: string
          description: First 1024 characters of combined stdout+stderr
        parse_result:
          type: string
          enum:
            - Parsed
            - KnownFailure
            - UnknownFormat
            - NoParser
            - ParserBug
          description: |
            - `Parsed`: effect was handled and facts were written to the campaign
            - `KnownFailure`: effect ran but produced expected-empty output (e.g. command not found)
            - `UnknownFormat`: output was present but the parser could not interpret it
            - `NoParser`: no compiled or external parser is registered for this effect (Gap 1 signal)
            - `ParserBug`: parser crashed or panicked
        detail:
          type: string
          description: Human-readable explanation of the parse outcome
        inferred_facts_written:
          type: integer
          description: Number of new entities or field updates written to the campaign graph

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        details:
          type: string

    ConsiderationScore:
      type: object
      description: One consideration's contribution to a candidate's score.
      required:
        - name
        - kind
        - raw
        - curved
        - weight
        - veto
      properties:
        name:
          type: string
          description: Consideration identifier (e.g. "privilege_gain").
        kind:
          type: string
          description: Whether this consideration contributes to utility or belief state.
          enum:
            - utility
            - belief
        raw:
          type: number
          format: float
          description: Raw measurement in [0, 1].
        curved:
          type: number
          format: float
          description: Measurement after the profile's response curve.
        weight:
          type: number
          format: float
          description: Weight applied from the profile.
        veto:
          type: boolean
          description: Whether this consideration acted as a multiplicative veto.

    ScoredCandidate:
      type: object
      description: A scored, grounded (TTP × target) action.
      required:
        - ttp_id
        - target_id
        - utility
        - utility_score
        - success_probability
        - breakdown
      properties:
        ttp_id:
          type: string
        target_id:
          type: string
        utility:
          type: number
          format: float
          description: Final ranking score in [0, 1], equal to utility_score × success_probability.
        utility_score:
          type: number
          format: float
          description: Intrinsic desirability of the action if it succeeds.
        success_probability:
          type: number
          format: float
          description: Belief-state probability that the action can be grounded and succeed.
        breakdown:
          type: array
          items:
            $ref: '#/components/schemas/ConsiderationScore'

    CombinationMode:
      type: string
      description: How per-consideration scores are combined into one utility.
      enum:
        - weighted_arithmetic
        - weighted_geometric
        - iaus_multiplicative

    ResponseCurve:
      type: object
      description: >-
        A response curve mapping a raw measurement in [0,1] to a tuned score in
        [0,1], internally tagged by `type`. Only the fields for the active type
        are meaningful (linear: slope/intercept; polynomial: exponent/slope/
        intercept; logistic: steepness/midpoint; step: threshold).
      required:
        - type
      properties:
        type:
          type: string
          enum: [linear, polynomial, logistic, step]
        slope:
          type: number
          format: float
        intercept:
          type: number
          format: float
        exponent:
          type: number
          format: float
        steepness:
          type: number
          format: float
        midpoint:
          type: number
          format: float
        threshold:
          type: number
          format: float

    NamedConsideration:
      type: object
      description: A consideration's tunable config, tagged with its name.
      required:
        - name
        - weight
        - curve
        - enabled
        - veto
      properties:
        name:
          type: string
        weight:
          type: number
          format: float
        curve:
          $ref: '#/components/schemas/ResponseCurve'
        enabled:
          type: boolean
        veto:
          type: boolean

    ScoringProfile:
      type: object
      description: The live scoring profile.
      required:
        - enabled
        - combination
        - tuningEnabled
        - considerations
      properties:
        enabled:
          type: boolean
          description: Whether utility-AI recommendations and action scoring are enabled.
        combination:
          $ref: '#/components/schemas/CombinationMode'
        tuningEnabled:
          type: boolean
          description: Whether scoring and the tuning UI feature flag are both enabled.
        considerations:
          type: array
          items:
            $ref: '#/components/schemas/NamedConsideration'

    ScoringProfileUpdate:
      type: object
      description: A scoring-profile update (runtime tuning).
      required:
        - combination
        - considerations
      properties:
        combination:
          $ref: '#/components/schemas/CombinationMode'
        considerations:
          type: array
          items:
            $ref: '#/components/schemas/NamedConsideration'

    CalibrationMetrics:
      type: object
      description: Fit-quality metrics from a calibration run.
      required:
        - decisions
        - top1Accuracy
        - meanChosenProb
        - minChosenProb
        - logLikelihood
        - infeasible
        - converged
      properties:
        decisions:
          type: integer
          description: Number of captured decisions the fit used.
        top1Accuracy:
          type: number
          format: float
          description: Fraction of decisions where the operator's choice ranks first.
        meanChosenProb:
          type: number
          format: float
          description: Mean probability the fitted model assigns the operator's choices.
        minChosenProb:
          type: number
          format: float
          description: Worst per-decision probability assigned to an operator choice.
        logLikelihood:
          type: number
          format: float
        infeasible:
          type: integer
          description: >-
            Decisions whose choice is Pareto-dominated — unreproducible by any
            non-negative weighting, signalling a missing consideration.
        converged:
          type: boolean

    CalibrationResult:
      type: object
      description: A calibration preview — the fitted profile plus fit metrics.
      required:
        - profile
        - metrics
      properties:
        profile:
          $ref: '#/components/schemas/ScoringProfile'
        metrics:
          $ref: '#/components/schemas/CalibrationMetrics'

    OwnerRef:
      type: object
      description: Reference to the Kubernetes owner of a resource (e.g. ReplicaSet → Pod).
      required:
        - name
        - kind
        - uid
      properties:
        name:
          type: string
        kind:
          type: string
        uid:
          type: string

    VolumeMount:
      type: object
      description: A volume mount on a pod — either a projected volume or a host-path bind mount.
      required:
        - name
        - mount_point
        - mount_root
        - read_only
        - is_host_path
      properties:
        name:
          type: string
        mount_point:
          type: string
          description: Path inside the container where the volume appears.
        mount_root:
          type: string
          description: Path on the host that is bound (for hostPath mounts).
        mount_type:
          type: string
        read_only:
          type: boolean
        is_host_path:
          type: boolean

    TTPStatus:
      type: string
      enum:
        - enabled
        - disabled
      description: Status of a TTP - whether it is enabled or disabled
