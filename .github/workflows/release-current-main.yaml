name: Release current main

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: release-current-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '[.packages[] | select(.name == "cli") | .version] | if length == 1 then .[0] else empty end'
          )"
          if [[ -z "$version" ]]; then
            echo "::error::Could not resolve exactly one cli package version"
            exit 1
          fi

          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure tag is new
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Bump workspace.package.version on main before releasing."
            exit 1
          fi

      - name: Create release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "Release ${TAG}"
          git push origin "$TAG"

      - name: Start tagged release build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: gh workflow run build-rust.yaml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

      - name: Summarize release
        env:
          COMMIT: ${{ steps.release.outputs.commit }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          {
            echo "## Release dispatched"
            echo
            echo "- Version: \`${VERSION}\`"
            echo "- Tag: \`${TAG}\`"
            echo "- Commit: \`${COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
