[package]
name = "ranplant"
version.workspace = true
edition = "2021"

[[bin]]
name = "ranplant"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ranplant-protocol = { path = "../ranplant-protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
url = "2.5"
webpki-roots = "1"

[dev-dependencies]
tempfile = "3"
