[package]
name = "kubetier"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
