[package]
name = "k8s"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
futures = "0.3"
k8s-openapi = { version = "0.27", features = ["v1_32"] }
kube = { version = "3.1", default-features = true, features = ["ws", "runtime"] }
serde = { workspace = true }
tokio = { version = "1", features = ["io-util", "rt", "time"] }
tracing = "0.1"
