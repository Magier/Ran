[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
armory = { path = "../armory" }
async-stream = "0.3"
async-trait = "0.1"
axum = "0.8"
chrono = { workspace = true }
campaign = { path = "../campaign" }
kubetier = { path = "../kubetier" }
utility-ai = { path = "../utility-ai" }
ran-domain = { path = "../domain" }
mime_guess = "2"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
] }
rmcp = { version = "1", features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rust-embed = "8"
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tracing = "0.1"

[dev-dependencies]
# Campaign exposes its KnowledgeGraph as a public field; tests reach for it to
# stage relations without going through a TTP execution.
cortex = { path = "../graph" }

[build-dependencies]
anyhow = "1"
serde_yaml = "0.9"
