[package]
name = "app"
version = "0.1.0"
edition = "2021"

[features]
bundled-armory = ["armory/bundled-armory"]

[dependencies]
anyhow = "1"
armory = { path = "../armory" }
async-trait = "0.1"
api = { path = "../api" }
axum = "0.8"
c2 = { path = "../c2" }
campaign = { path = "../campaign" }
utility-ai = { path = "../utility-ai" }
k8s = { path = "../k8s" }
kubetier = { path = "../kubetier" }
planner = { path = "../planner" }
ran-domain = { path = "../domain" }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "charset",
    "http2",
    "system-proxy",
    "json",
] }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "process", "io-util"] }
tracing = "0.1"
if-addrs = "0.15.0"

[dev-dependencies]
tempfile = "3"
