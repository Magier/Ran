[package]
name = "app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
armory = { path = "../armory" }
async-trait = "0.1"
api = { path = "../api" }
axum = "0.7"
c2 = { path = "../c2" }
campaign = { path = "../campaign" }
k8s = { path = "../k8s" }
ran-domain = { path = "../domain" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "process", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
