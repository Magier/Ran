[package]
name = "app"
version = "0.1.0"
edition = "2021"

[features]
bundled-armory = ["armory/bundled-armory"]

[dependencies]
anyhow = "1"
armory = { path = "../armory" }
async-trait = "0.1"
api = { path = "../api" }
axum = "0.8"
c2 = { path = "../c2" }
campaign = { path = "../campaign" }
utility-ai = { path = "../utility-ai" }
k8s = { path = "../k8s" }
planner = { path = "../planner" }
ran-domain = { path = "../domain" }
reqwest = { version = "0.13", features = ["json"] }
serde = { workspace = true }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "process", "io-util"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
