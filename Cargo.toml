[workspace]
members  = ["crates/*"]
# Keep the armory websocket tool out of the workspace (it manages its own deps)
exclude  = ["armory/tools/websocket_client"]
resolver = "2"

[workspace.package]
version = "0.2.1-alpha.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
