name: zrok
description: zrok is a tool for securely exposing local services to the internet using encrypted tunnels.
local: true

functions:
  get_overview:
    description: Retrieve all of the zrok account details (environments, shares)
    command: zrok overview
  share_reserve:
    description: start a backend for a reserved share
    tactic: Resource Development
    techniques: ["Stage Capabilities"]
    parameters:
      shareToken:
        type: string
        required: true
        description: to token to identify the share
    args:
      shareToken: "r87y3zg1dvjp"
    command:
      zrok share reserved ${shareToken} --headless
      # --headless
  # share_proxy:
  # command
