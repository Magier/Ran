name: curl
description: curl is a command-line tool for transferring data with URLs.

functions:
  download_file:
    description: Retrieve all of the zrok account details (environments, shares)
    parameters:
      URL:
        type: string
        description: the url from where to download the binary
      DST_BIN:
        type: string
        description: the destination path of the binary at the remote system
        required: false
    command: curl -LO ${URL}
