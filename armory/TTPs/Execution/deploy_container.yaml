name: Deploy Container
description: Deploy a container into an environment to facilitate execution or evade defenses
tactic: Execution
techniques: ["Deploy Container"]
parameters:
  Name:
    type: string
    description: the name of the resulting workload. The name must be RFC 1123 compliant.
    default: ${POD_NAME}-${RANDOM}
  Namespace:
    type: string
    default: ${NS}
    description: the namespace in which the workload will be deployed
  Image:
    type: string
    default: nginx
    description: the image used by the workload
  # Command:   # currently this is a string, but the cmdVariant excepts a list
  #   type: string
  #   default: sleep infinity
  #   description: the command executed when starting the container
  ServiceAccount:
    type: string
    default: ""
    required: false
    description: the service account used by the workload
  Privileged:
    type: bool
    default: false
    description: is the container is running in privileged mode
  HostIPC:
    type: bool
    default: false
    description: is the IPC namespace shared with the host
  HostPID:
    type: bool
    default: false
    description: is the PID namespace shared with the host
  HostNetwork:
    type: bool
    default: false
    description: is the network shared with the host
  NodeName:
    type: string
    default: ""
    description: the name of the node where the pod should be deployed
  Identity:
    type: string
    description: the identity used to deploy the container
cmdVariants:
  - key: kubectl
    command: |+
      echo '{
        "apiVersion": "v1",
        "kind": "Pod",
        "metadata": {
          "name": "${NAME}",
          "namespace": "${NAMESPACE}"
        },
        "spec": {
          "hostPID": ${HOSTPID},
          "hostIPC": ${HOSTIPC},
          "hostNetwork": ${HOSTNETWORK},
          "serviceAccountName": "${SERVICEACCOUNT}",
          "nodeName": "${NODENAME}",
          "containers": [{
              "name": "${NAME}",
              "image": "${IMAGE}",
              "command": ["sleep", "infinity"],
                "securityContext": {
                  "privileged": ${PRIVILEGED}
              }
          }]
        }
      }' | kubectl apply -f -  
      && 
      kubectl wait --for=jsonpath='{.status.containerStatuses[*].state.running}' pod/${NAME}
preconditions:
  accessLevel: "can-create"
effects:
  - Pod($p2)
  - Namespace($ns)
  - ns.contains($p)
  - created(creator:$p1, target:$p2)
parser: newContainer
defend: {}
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/New%20Container/
  - https://kubenomicon.com/Execution/New_container.html
  - https://bishopfox.com/blog/kubernetes-pod-privilege-escalation
