name: Deploy Container
description: Deploy a container into an environment to facilitate execution or evade defenses
tactic: Execution
techniques: ["Deploy Container"]
parameters:
  Name:
    type: string
    description: the name of the resulting workload
  Namespace:
    type: string
    default: default
    description: the namespace in which the workload will be deployed
  Image:
    type: string
    default: nginx
    description: the image used by the workload
  Command:
    type: string
    default: sleep infinity
    description: the command executed when starting the container
  HostIPC:
    type: bool
    description: is the IPC namespace shared with the host
  HostPID:
    type: bool
    description: is the PID namespace shared with the host
  HostNetwork:
    type: bool
    description: is the network shared with the host
  Identity:
    type: string
    description: the identity used to deploy the container
  NodeName:
    type: string
    description: the name of the node where the pod should be deployed
cmdVariants:
  - key: kubectl
    command: kubectl run ${NAME} --image=${IMAGE} --field-manager Ran --command -- ${COMMAND}
preconditions:
  accessLevel: "can-create"
effects:
  - Pod($p)
  - Namespace($ns)
  - ns.contains($p)
defend: {}
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/New%20Container/
  - https://kubenomicon.com/Execution/New_container.html
