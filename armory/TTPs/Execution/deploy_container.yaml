name: Deploy Container
description: Deploy a container into an environment to facilitate execution or evade defenses
tactic: Execution
techniques: ["Deploy Container", T1610]
parameters:
  PodName:
    type: string
    description: the name of the resulting workload. The name must be RFC 1123 compliant.
    default: ${POD_NAME}-${RANDOM}
  Namespace:
    type: string
    default: ${NS}
    description: the namespace in which the workload will be deployed
  Image:
    type: string
    default: nginx
    description: the image used by the workload
  # Command:   # currently this is a string, but the procedure excepts a list
  #   type: string
  #   default: sleep infinity
  #   description: the command executed when starting the container
  ServiceAccount:
    type: string
    default: ""
    required: false
    description: the service account used by the workload
  Privileged:
    type: bool
    default: false
    description: is the container is running in privileged mode
  HostIPC:
    type: bool
    default: false
    description: is the IPC namespace shared with the host
  HostPID:
    type: bool
    default: false
    description: is the PID namespace shared with the host
  HostNetwork:
    type: bool
    default: false
    description: is the network shared with the host
  HostPath:
    type: string
    default: "/"
    description: the host path mounted into the container with pattern <path on host>:<path in pod>
  Mount:
    type: string
    default: "/host"
    description: the host path mounted into the container with pattern <path on host>:<path in pod>
  NodeName:
    type: string
    default: "${NODE_NAME}"
    description: the name of the node where the pod should be deployed
  Identity:
    type: string
    description: the identity used to deploy the container
procedures:
  - key: kubectl
    command: |+
      echo '{
        "apiVersion": "v1",
        "kind": "Pod",
        "metadata": {
          "name": "{{.PodName}}",
          "namespace": "{{.Namespace}}"
        },
        "spec": {
          "hostPID": {{ .HostPID }},
          "hostIPC": {{ .HostIPC }},
          "hostNetwork": {{.HostNetwork }},
          "serviceAccountName": "{{.ServiceAccount }}",
          "nodeName": "{{.NodeName}}",
          "containers": [{
              "name": "{{.PodName}}",
              "image": "{{.Image}}",
              "command": ["sleep", "infinity"],
                "securityContext": {
                  "privileged": {{.Privileged }}
              }
              {{if .Mount}}
              , "volumeMounts": [{"name": "hostmount", "mountPath": "{{ .Mount }}"} ]
              {{end}}
          }]

          {{if .HostPath }}
          , "volumes": [{
            "name": "hostmount", "hostPath": {"path": "{{.HostPath}}" }
          }] 
          {{ end }}
        }
      }' | kubectl apply -f -  
      && 
      kubectl wait --for=jsonpath='{.status.containerStatuses[*].state.running}' pod/{{.PodName}}
preconditions:
  rbac: 
    - verb: create
      resource: pods
effects:
  - create k8s.Pod
  - Namespace($ns)
  - ns.contains($p2)
  - created(creator:$p1, target:$p2)
defend: 
  id: D3-PM
  name: Platform Monitoring
  url: https://d3fend.mitre.org/technique/d3f:PlatformMonitoring/
  sigma: 
    title: Create
    status: experimental
    description: Detects creation of a new Pod
    date: 2025/09/30
    logsource:
      category: application
      product: kubernetes
      service: audit
    detection:
      selection:
        verb: 'create'
        objectRef.resource: 'pods'
        requestObject.spec.hostNetwork: true # TODO: conditional check only if `hostNetwork` is true
      condition: selection
    falsepositives:
      - Legitimate creation of a new Pod
    references:
      - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/kubernetes/privilege_escalation_pod_created_with_hostnetwork
    stp: 5A
    level: medium
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/New%20Container/
  - https://kubenomicon.com/Execution/New_container.html
  - https://bishopfox.com/blog/kubernetes-pod-privilege-escalation
