name: Install Package
description: Using the OS package manager
tactic: Execution
techniques: ["User Execution"]
# preconditions:
preconditions:
  kind: System
  accessLevel: user-exec
parameters:
  PKG:
    default: curl
    type: string
    description: the name of the tool to install
args: # default values if none is provided
  PKG: "curl"
procedures:
  - key: ubuntu
    tool: apt
    command: apt-get update  && apt-get install -y  ${PKG}; results=$(dpkg -L ${PKG} 2>/dev/null | while read f; do [ -f "$f" ] && [ -x "$f" ] && echo "$f"; done); echo "$results"; [ -n "$results" ]
effects: ["sys.has-binary(${PKG})"]
cleanup:
    key: ubuntu
    command: apt remove -y ${PKG}
# effects: ["has-binary(${TARGET}, ${PKG}"]
# defend: {}
