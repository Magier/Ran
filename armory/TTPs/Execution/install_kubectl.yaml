name: Install kubectl
description: Install kubectl to easy execution of further k8s-related commands
tactic: Execution
techniques: ["User Execution"]
# preconditions:
preconditions:
  kind: Pod
  accessLevel: user-exec
parameters:
  PATH:
    default: /usr/bin/kubectl
    type: string
    description: the target path where to install the binary
cmdVariants:
  - key: curl
    command: >
      mkdir -p `dirname ${PATH}`
      && curl -sL "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o ${PATH}
      && chmod +x ${PATH}
# effects: ["ListenerReady"]
# defend: {}
references:
