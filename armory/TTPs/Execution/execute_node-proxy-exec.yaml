    #   {{ else }}
    #   TOKEN=${TOKEN} ran-ws "wss://${NODE}:10250/exec/${NAMESPACE}/${POD_NAME}/${CONTAINER}?output=1&error=1&command=${COMMAND}"
    #   {{ end}}
