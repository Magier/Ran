name: Execute via Node/Proxy 
description: Execute a command on a target node via the kubelet API proxy
tactic: Execution
techniques: ["Command and Scripting Interpreter: Unix Shell"]
preconditions:
  accessLevel: user-exec
  kind: System
  binary: "ran-ws"
  # rbac: 
  # - verb: get
  #   resource: "nodes/proxy"
parameters:
  NAMESPACE:
    type: Namespace
    default: ${TARGET}
    description: Kubernetes namespace of the target pod
  POD_NAME:
    type: Pod
    default: ${TARGET}
    description: Name of the target pod
  CONTAINER:
    type: string
    description: Name of the target container in the pod
  NODE:
    type: Node
    description: Name or IP of the node on which the pod is running. 
  COMMAND:
    type: string
    description: the command to execute in the shell
  ARGS:
    type: string
    description: the arguments to pass to the command
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    default: ""
  BACKGROUND:
    type: bool
    description: whether to run the command in the background
    default: false
procedures:
  - key: ran-ws
    command: ran-ws --node ${NODE} --ns ${NAMESPACE} --pod ${POD_NAME} --container ${CONTAINER} --token ${TOKEN} --command ${COMMAND} {{ if .ARGS }} --command ${ARGS} {{ end }}
