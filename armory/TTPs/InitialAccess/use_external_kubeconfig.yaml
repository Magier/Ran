id: initial-access-pod-exec
name: Exec Into Initial Pod
description: Use an external kubeconfig file to access resources in the target cluster
tactic: Initial Access
techniques:
  ["Valid Accounts: Cloud Accounts", T1078.004]
preconditions:
  kind: Cluster
parameters:
  Namespace: 
    type: Namespace
    description: The target namespace in which the target pod resides
  TargetName: 
    type: Pod
    description: The target pod to access using the external kubeconfig
procedures:
  - key: setTarget
    command: setTarget(${NAMESPACE}, ${TARGETNAME})
    isLocal: true
effects:
  - k8s.Pod
  - "k8s.can-exec(c2/Ran, ${TARGET})"
defense:
  id: D3-PM
  name: Platform Monitoring
  url: https://d3fend.mitre.org/technique/d3f:PlatformMonitoring/
  sigma: 
    title: Potential Remote Command Execution In Pod Container
    id: a1b0ca4e-7835-413e-8471-3ff2b8a66be6
    status: experimental
    description: Detects attempts to execute remote commands, within a Pod's container using e.g. the "kubectl exec" command.
    author: Leo Tsaousis (@laripping)
    references:
      - "https://github.com/SigmaHQ/sigma/blob/master/rules/application/kubernetes/audit/kubernetes_audit_exec_into_container.yml"
    date: 2024-03-26
    tags:
      - attack.t1609
      - attack.execution
    logsource:
        category: application
        product: kubernetes
        service: audit
    detection:
        selection:
            verb: 'create'
            objectRef.resource: 'pods'
            objectRef.subresource: 'exec'
        condition: selection
    falsepositives:
        - Legitimate debugging activity. Investigate the identity performing the requests and their authorization.
    level: medium
    stp: 5A
references:
  - "https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Kubeconfig%20file/"
  - "https://kubenomicon.com/Initial_access/Kubeconfig_file.html"
