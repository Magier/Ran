id: valid-accounts-kubeconfig
name: Execute into pod via Valid Account
description: Use credentials from the active external kubeconfig to establish access to the target pod
tactic: Initial Access
techniques: [Valid Accounts, T1078]
preconditions:
  kind: Pod
  activeKubeconfig: true
parameters:
  Interactive:
    type: bool
    description: Open a persistent kubectl exec session instead of verifying access once
    required: false
    default: "true"
  Container:
    type: string
    description: Container name to exec into (defaults to the pod's first container)
    required: false
    default: ""
procedures:
  - key: kubectl
    command: >-
      {% if Interactive %}
      c2.kubectl_exec({% if Container %}${Container}{% endif %})
      {% else %}
      kubectl exec -n ${NAMESPACE} ${PODNAME}{% if Container %} -c ${Container}{% endif %} -- true
      {% endif %}
    isLocal: true
effects:
  - "k8s.can-exec(c2/Ran, ${TARGET_ID})"
defense:
  id: D3-PM
  name: Platform Monitoring
  url: https://d3fend.mitre.org/technique/d3f:PlatformMonitoring/
  sigma:
    title: Potential Remote Command Execution In Pod Container
    id: a1b0ca4e-7835-413e-8471-3ff2b8a66be6
    status: experimental
    description: Detects attempts to execute remote commands, within a Pod's
      container using e.g. the "kubectl exec" command.
    author: Leo Tsaousis (@laripping)
    references:
      - "https://github.com/SigmaHQ/sigma/blob/master/rules/application/kuberne\
        tes/audit/kubernetes_audit_exec_into_container.yml"
    date: 2024-03-26
    tags:
      - attack.t1609
      - attack.execution
    logsource:
      category: application
      product: kubernetes
      service: audit
    detection:
      selection:
        verb: "create"
        objectRef.resource: "pods"
        objectRef.subresource: "exec"
      condition: selection
    falsepositives:
      - Legitimate debugging activity. Investigate the identity performing the
        requests and their authorization.
    level: medium
    stp: 5A
references:
  - "https://attack.mitre.org/techniques/T1078/"
  - "https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Kubeco\
    nfig%20file/"
  - "https://kubenomicon.com/Initial_access/Kubeconfig_file.html"
