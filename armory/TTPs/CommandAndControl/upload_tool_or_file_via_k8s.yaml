id: upload-tool-or-file-via-k8s
name: Upload Tool or File via k8s
description: Transfer tools or other files from an external system into a compromised environment.
tactic: Command And Control
techniques: ["Ingress Tool Transfer"]
parameters:
  SRC_PATH:
    type: string
    description: Path to the file which will be transfered to the target system
  DST_PATH:
    type: string
    description: Path on the target system where the file will be transfered
  POD_NAME:
    type: Pod
    description: Name of the target pod
    default: ${TARGET} 
  NAMESPACE:
    type: Namespace
    description: Kubernetes namespace of the target pod
  Unpack:
    type: bool
    description: Flag if the file should be unpacked after transfer
  # DST_DIR:
  #   type: string
  #   description: Path on the target system where the file will be transfered
procedures:
  - key: kubectl
    command: kubectl cp -n ${NAMESPACE} ${SRC_PATH} ${POD_NAME}:${DST_PATH}
    isLocal: true
  # - key: sliver
  #   command: get_file ${SRC_PATH}
preconditions:
  accessLevel: user-exec
  kind: Pod
effects:
  - "sys.has-binary(${DST_PATH})"
