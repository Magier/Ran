id: read-serviceaccount-token-from-redis
name: Read Service Account Token from Redis
description: >-
  Read a bearer credential captured in a Redis key, remove its Bearer prefix,
  and emit only the JWT. The rawServiceaccountToken effect validates and
  parses the JWT claims into Ran's ServiceAccount, Namespace, and Pod facts.
  This is intended for a Redis instance already reachable through an
  established execution path.
tactic: Credential Access
techniques: ["Steal Application Access Token", "T1528"]
parameters:
  REDIS_KEY:
    type: string
    default: oopservability:receiver:last-authorization
    description: the Redis key containing the captured Authorization value
procedures:
  - key: redis-cli
    tool: redis-cli
    command: >-
      redis-cli --raw GET ${REDIS_KEY} | sed -n 's/^Bearer //p'
preconditions:
  kind: Pod
  accessLevel: user-exec
effects:
  - rawServiceaccountToken
references:
  - https://github.com/Magier/Oopserability/blob/main/manifests/cve-2026-47701/README.md
