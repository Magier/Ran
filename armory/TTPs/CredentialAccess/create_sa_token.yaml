name: Create New Service Account Token
description: Create a new service account token
tactic: Credential Access
techniques: [T1078.003, "Create Account: Local Account"]
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  SERVICEACCOUNT:
    type: string
    default: ${TARGET}
    description: the name of the service account for which the token will be created
  DURATION:
    type: string
    default: "0" # 0 means the duration is determined by the API server
    description: the duration of the token
procedures:
  - key: kubectl
    command: >
      kubectl ${K8S_AUTH} create token ${SERVICEACCOUNT} --duration=24h
preconditions:
  kind: ServiceAccount
  accessLevel: user-read
  rbac: 
    - verb: create 
      resource: serviceaccount/token
effects:
  - rawServiceaccountToken
