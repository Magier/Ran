name: Read Service Account Token
description: Reads the service account token mouneted inside a K8s pod
tactic: Credential Access
techniques: ["Steal Application Access Token"]
parameters:
  PATH:
    type: string
    description: the path to the service account
    default: "/var/run/secrets/kubernetes.io/serviceaccount/token"
cmdVariants:
  - key: cat
    command: cat ${PATH}
  - key: sliver
    command: get_file ${PATH}
preconditions:
  accessLevel: user-read
  kind: Pod
effects:
  - "src.pod.name"
  - "ServiceAccount.name"
  - "Namespace.name"
parser: rawServiceaccountToken

# dependencies:
#   - type: Kubernetes Pod
#     description: A running Kubernetes pod with a mounted service account token.
execution:
  steps:
    - description: Read the service account token from the pod
      command: |
        cat /var/run/secrets/kubernetes.io/serviceaccount/token
indicators:
  - type: File
    description: The service account token file
    location: /var/run/secrets/kubernetes.io/serviceaccount/token
references:
  - https://kubernetes.io/docs/tasks/access-application-cluster/access-cluster/#accessing-the-api-from-a-pod
