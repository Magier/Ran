name: List K8s secrets
description: Get a Kubernetes secrets via the API server
tactic: Credential Access
techniques: [ "Unsecured Credentials: Container API", "T1552.007" ]
preconditions:
  rbac:
    - verb: get
      resource: secrets
    - verb: list
      resource: secrets
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get secrets --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: http-request
    tool: http-request
    note: Abstract HTTP request. Runtime selects the concrete HTTP client.
    http_request:
      url: >-
        {% if ALL_NS %} ${API_SERVER}/api/v1/secrets?limit=500 {% else %}
        ${API_SERVER}/api/v1/namespaces/${NS}/secrets?limit=500 {% endif %}
      headers:
        Accept: application/json
        User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69
        Authorization: Bearer ${TOKEN}
effects:
  - k8s.secretList
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/List%20K8S%20secrets/
  - https://attack.mitre.org/techniques/T1552/007/
