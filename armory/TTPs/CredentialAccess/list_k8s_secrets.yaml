name: List K8s secrets
description: Get a Kubernetes secrets via the API server
tactic: Credential Access
techniques: [ "Unsecured Credentials: Container API", "T1552.007" ]
preconditions:
  rbac:
    - verb: get
      resource: secrets
    - verb: list
      resource: secrets
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get secrets --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /api/v1
      resource: secrets
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      token: ${TOKEN}
      use_ca: false
effects:
  - k8s.secretList
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/List%20K8S%20secrets/
  - https://attack.mitre.org/techniques/T1552/007/
