name: Read Service Account Token
description: Reads the service account token mounted inside a pod that uses this service account
tactic: Credential Access
techniques: [ "Steal Application Access Token", "T1528" ]
parameters:
  PATH:
    type: string
    description: the path to the service account token
    default: "/var/run/secrets/kubernetes.io/serviceaccount/token"
procedures:
  - key: cat
    command: cat ${PATH}
preconditions:
  kind: ServiceAccount
  related:
    - kind: Pod
      accessLevel: exec
effects:
  - rawServiceaccountToken
  - "Pod.name"
  - "ServiceAccount.name"
  - "Namespace.name"
execution:
  steps:
    - description: Read the service account token from a pod that mounts this service account
      command: |
        cat /var/run/secrets/kubernetes.io/serviceaccount/token
indicators:
  - type: File
    description: The service account token file
    location: /var/run/secrets/kubernetes.io/serviceaccount/token
defense:
  id: D3-FAPA
  name: File Access Pattern Analysis
  url: https://d3fend.mitre.org/technique/d3f:FileAccessPatternAnalysis/
  sigma:
    title: Access to Kubernetes Service Account Token
    id: e1c45622-5f7e-4ef6-a7d2-42bc3d78d44b
    status: experimental
    description: Detects access to the Kubernetes service account token mounted
      inside a container/pod
    date: 2025/07/13
    logsource:
      product: linux
      category: process_access
    detection:
      selection:
        file.path|contains: "/var/run/secrets/kubernetes.io/serviceaccount/token"
      condition: selection
    stp: 5K
    falsepositives:
      - Legitimate Kubernetes control plane components or sidecars accessing the
        token
      - Custom controllers or services using the token for API access
  level: medium

references:
  - https://kubernetes.io/docs/tasks/access-application-cluster/access-cluster/#accessing-the-api-from-a-pod
