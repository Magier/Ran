name: List ConfigMaps
description: Get a Kubernetes ConfigMaps via the API server
tactic: Credential Access
techniques: [ "Unsecured Credentials: Container API", "T1552.007" ]
preconditions:
  rbac:
    - verb: "get"
      resource: "configmap"
    - verb: "list"
      resource: "configmap"
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get configmaps from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get configmap --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /api/v1
      resource: configmaps
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      token: ${TOKEN}
      use_ca: false
effects:
  - k8s.configmaplist
references:
  - https://attack.mitre.org/techniques/T1552/007/
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Application%20credentials%20in%20configuration%20files/
  - https://kubenomicon.com/Credential_access/Application_credentials_in_configuration_files.html
