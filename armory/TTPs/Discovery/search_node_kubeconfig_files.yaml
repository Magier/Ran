name: Search node kubeconfig files
description: Search Kubernetes configuration locations on a node through a pod hostPath mount.
tactic: Discovery
techniques: ["T1083", "File and Directory Discovery"]
parameters:
  MOUNT_PATH:
    type: string
    description: root of the node filesystem mounted in the execution pod
    required: false
    default: "${SRC.MOUNT_PATH}"
  SEARCH_PATHS:
    type: stringList
    description: Kubernetes configuration directories to search, relative to the node filesystem root
    default:
      - "etc/kubernetes"
      - "var/lib/kubelet"
      - "root/.kube"
      - "etc/rancher"
      - "etc/k0s"
      - "var/lib/k0s/pki"
      - "var/snap/microk8s/current/credentials"
  PATTERN:
    type: string
    description: content pattern used to identify kubeconfig files
    default: "client-key-data"
  EXCLUDED_DIRS:
    type: stringList
    description: directories to exclude, relative to the node filesystem root
    default:
      - "proc"
      - "sys"
      - "dev"
      - "var/lib/kubelet/pods"
      - "var/lib/kubelet/plugins"
      - "var/lib/kubelet/plugins_registry"
      - "var/lib/kubelet/device-plugins"
procedures:
  - key: grep
    command: >-
      root={{ MOUNT_PATH | shell_quote }};
      [ -n "$root" ] || root=/;
      prefix=$(dirname "$root/.");
      [ "$prefix" = / ] && prefix="";
      runner="";
      if command -v timeout >/dev/null 2>&1; then runner="timeout -k 1s 6s";
      elif command -v busybox >/dev/null 2>&1 && busybox timeout --help >/dev/null 2>&1; then runner="busybox timeout -k 1s 6s";
      else echo "kubeconfig search skipped: timeout is unavailable" >&2; exit 0;
      fi;
      for search_root in
      {% for path in SEARCH_PATHS %}
        "$prefix"/{{ path | shell_quote }}
      {% endfor %}
      ; do
        [ -d "$search_root" ] || continue;
        $runner find "$search_root" -maxdepth 4
        {% for dir in EXCLUDED_DIRS %}
          -type d -path "$prefix/{{ dir }}" -prune -o
        {% endfor %}
        -type f \(
          -name config -o
          -name '*.conf' -o
          -name '*.config' -o
          -name '*kubeconfig*' -o
          -name '*.yaml' -o
          -name '*.yml'
        \) -exec grep -swIl -e '${PATTERN}' {} \; || true;
      done
preconditions:
  kind: Node
effects:
  - sys.files
indicators:
  - type: File
    description: A kubeconfig file on the node filesystem
    location: "${MOUNT_PATH}/${PATH}"
references:
  - https://attack.mitre.org/techniques/T1083/
