name: Search pod kubeconfig files
description: Search common kubeconfig locations in the local pod filesystem.
tactic: Discovery
techniques: ["T1083", "File and Directory Discovery"]
parameters:
  MOUNT_PATH:
    type: string
    description: root of the local pod filesystem
    required: false
    default: "/"
  SEARCH_PATHS:
    type: stringList
    description: kubeconfig directories to search, relative to the pod filesystem root
    default:
      - "root/.kube"
      - "etc/kubernetes"
  PATTERN:
    type: string
    description: content pattern used to identify kubeconfig files
    default: "client-key-data"
  EXCLUDED_DIRS:
    type: stringList
    description: directories to exclude, relative to the pod filesystem root
    default: ["proc", "sys", "dev"]
procedures:
  - key: grep
    command: >-
      root={{ MOUNT_PATH | shell_quote }};
      [ -n "$root" ] || root=/;
      prefix=$(dirname "$root/.");
      [ "$prefix" = / ] && prefix="";
      runner="";
      if command -v timeout >/dev/null 2>&1; then runner="timeout -k 1s 6s";
      elif command -v busybox >/dev/null 2>&1 && busybox timeout --help >/dev/null 2>&1; then runner="busybox timeout -k 1s 6s";
      else echo "kubeconfig search skipped: timeout is unavailable" >&2; exit 0;
      fi;
      for search_root in
      {% for path in SEARCH_PATHS %}
        "$prefix"/{{ path | shell_quote }}
      {% endfor %}
      ; do
        [ -d "$search_root" ] || continue;
        $runner find "$search_root" -maxdepth 4
        {% for dir in EXCLUDED_DIRS %}
          -type d -path "$prefix/{{ dir }}" -prune -o
        {% endfor %}
        -type f \(
          -name config -o
          -name '*.conf' -o
          -name '*.config' -o
          -name '*kubeconfig*' -o
          -name '*.yaml' -o
          -name '*.yml'
        \) -exec grep -swIl -e '${PATTERN}' {} \; || true;
      done
preconditions:
  kind: System
  accessLevel: user-exec
effects:
  - sys.files
indicators:
  - type: File
    description: A kubeconfig file in the pod filesystem
    location: "${MOUNT_PATH}/${PATH}"
references:
  - https://attack.mitre.org/techniques/T1083/
