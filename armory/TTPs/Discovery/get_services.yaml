id: get-services
name: Get Services via API Server
description: Enumerate Kubernetes Services via the K8s API server to map
  internal service endpoints and identify externally exposed workloads
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: services
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: namespace to enumerate
    default: ${NS}
  ALL_NS:
    type: bool
    description: enumerate services across all namespaces
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get services --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /api/v1
      resource: services
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      token: ${TOKEN}
      use_ca: false
effects:
  - k8s.servicelist
references:
  - https://kubernetes.io/docs/concepts/services-networking/service/
  - https://attack.mitre.org/techniques/T1613/
