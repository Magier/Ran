name: List Content of a GCP Bucket
description: List the Contents of a GCP Storage Bucket using the GCP service
  account token and project ID
tactic: Discovery
status: disabled
techniques: [ "Cloud Infrastructure Discovery", T1580 ]
preconditions:
  kind: GCPBucket
parameters:
  TOKEN:
    type: string
    description: The GCP service account access token
  BUCKET_NAME:
    type: string
    description: The name of the GCP bucket
    default: ${TARGET}
procedures:
  - http_request:
      url: https://storage.googleapis.com/storage/v1/b/${BUCKET_NAME}/o
      headers:
        Authorization: Bearer ${TOKEN}
effects: [ "GCP.Buckets" ]
references:
  - https://attack.mitre.org/techniques/T1580/
