name: NMap Host Scan
description: Perform an Nmap host scan on a specified CIDR range to identify reachable systems
tactic: Discovery
techniques: ["Network Service Discovery", T1046]
preconditions:
  kind: System
  accessLevel: user-exec
  sys.has-binary: nmap
parameters:
  CIDR:
    type: string
    description: the CIDR range to scan
    default: "${TARGET.IP}/24"
  SCAN_TYPES:
    type: stringList
    description: Nmap scan modes; sT performs TCP connect scanning and sV enables service/version fingerprinting
    default: [sT]
    options: [sT, sV]
  FAST_SCAN:
    type: bool
    description: use Nmap fast mode (-F) to scan fewer ports
    default: false
  THREADS:
    type: int
    description: the number of concurrent threads to use
    default: 10
procedures:
  - key: nmap
    tool: nmap
    command: >-
      nmap
      {% for scan_type in SCAN_TYPES %}-{{ scan_type }} {% endfor %}
      {% if FAST_SCAN %}-F {% endif %}
      ${CIDR}
effects:
  - network.discovery
references:
