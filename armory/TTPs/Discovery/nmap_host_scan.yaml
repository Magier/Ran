name: NMap Host Scan
description: Perform a host scan with namp on a specified CIDR range to identify reachable systems
tactic: Discovery
techniques: ["Network Service Discovery", T1046]
preconditions:
  kind: System
  accessLevel: user-exec
  sys.has-binary: nmap
parameters:
  CIDR:
    type: string
    description: the CIDR range to scan
    default: "${TARGET.IP}/24"
  THREADS:
    type: int
    description: the number of concurrent threads to use
    default: 10
  TIMEOUT:
    type: int
    description: the timeout duration for each request
    default: 3
procedures:
  - key: nmap
    tool: nmap
    command: nmap -sn ${CIDR}
effects:
  - rDNS
references: