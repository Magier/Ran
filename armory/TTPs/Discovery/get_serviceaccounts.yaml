name: Get ServiceAccounts
description: Get a list of ServiceAccounts via the API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  # accessLevel: user-read
  rbac:
    - verb: get
      resource: serviceaccounts
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    # default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get serviceaccounts --token=${TOKEN} -n=${NS} -A=${ALL_NS}
      --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /api/v1
      resource: serviceaccounts
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      token: ${TOKEN}
      use_ca: false
effects:
  - k8s.serviceAccountList
# defend: {}
references:
