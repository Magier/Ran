name: Get Pods via API Server
description: Get a list of pods via the API server
tactic: Discovery
techniques: ["Container and Resource Discovery", T1613]
preconditions:
  # accessLevel: user-read
  rbac: "get/list pods"
parameters:
  TOKEN:
    type: string
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: string
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get pods --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: curl
    command: >-
      curl -XGET 
      -H "Accept: application/json;as=Table;v=v1;g=meta.k8s.io,application/json;as=Table;v=v1beta1;g=meta.k8s.io,application/json"
      -H "User-Agent: kubectl/v1.30.3 (linux/amd64) kubernetes/6fc0a69"
      -H "Authorization: Bearer ${TOKEN}"
      '${API_SERVER}/api/v1/namespaces/${NS}/pods?limit=500
effects:
  - k8s.podList
# defend: {}
references:
