id: get-pods
name: Get Pods via K8s API
description: Get a list of pods via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  # accessLevel: user-read
  rbac:
    - verb: list
      resource: pods
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get pods --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: http-request
    tool: http-request
    note: Abstract HTTP request. Runtime selects the concrete HTTP client.
    http_request:
      url: >-
        {% if ALL_NS %} ${API_SERVER}/api/v1/pods?limit=500 {% else %}
        ${API_SERVER}/api/v1/namespaces/${NS}/pods?limit=500 {% endif %}
      headers:
        Accept: application/json
        User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69
        Authorization: Bearer ${TOKEN}
      ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
effects:
  - k8s.podList
# defend: {}
references:
