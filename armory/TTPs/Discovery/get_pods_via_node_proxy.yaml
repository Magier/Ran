name: Get Pods via Node/Proxy
description: Get a list of pods on the node through the Kubernetes API server proxy
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  kind: Node
  rbac:
    - verb: get
      resource: "nodes/proxy"
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  NODE:
    type: string
    default: ${TARGET}
    description: the name of the node for which the running pods will be listed
procedures:
  - k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /api/v1
      resource: nodes/${NODE}/proxy/pods
      cluster_scoped: true
      use_ca: false

effects:
  - k8s.podList
# defend: {}
references:
  - https://www.aquasec.com/blog/privilege-escalation-kubernetes-rbac/
  - https://kubenomicon.com/Discovery/Access_kubelet_API.html
  - https://gist.github.com/lizrice/c32740fac51db2a5518f06c3dae4944f
  - https://microsoft.github.io/Threat-Matrix-for-Kubernetes/techniques/Access%20Kubelet%20API/
