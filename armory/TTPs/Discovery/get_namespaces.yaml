id: get-namespaces
name: Get Namespaces
description: Get a list of namespaces from the Kubernetes API server
tactic: Discovery
techniques: ["Container and Resource Discovery", "T1613"]
preconditions:
  rbac:
    - verb: list
      resource: namespaces
parameters:
  TOKEN:
    type: ServiceAccount
    description: The ServiceAccount token used to authorize this request
    optional: true
    default: ""
procedures:
  - key: kubectl
    command: kubectl get namespaces --token=${TOKEN} --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /api/v1
      resource: namespaces
      cluster_scoped: true
      query: limit=500
      token: ${TOKEN}
      ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
effects:
  - k8s.namespaceList
references: []
