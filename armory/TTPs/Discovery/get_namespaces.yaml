id: get-namespaces
name: Get Namespaces via K8s API
description: Get a list of namespaces from the Kubernetes API server
tactic: Discovery
techniques: ["Container and Resource Discovery", "T1613"]
preconditions:
  rbac:
    - verb: list
      resource: namespaces
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
procedures:
  - key: kubectl
    command: kubectl get namespaces ${K8S_AUTH} --output=json
  - key: k8s-request
    k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /api/v1
      resource: namespaces
      cluster_scoped: true
      query: limit=500
      ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
effects:
  - k8s.namespaceList
references: []
