name: Get VolumeMounts
description: Get a list of volumes mounted in the pod
tactic: Discovery
techniques: ["Container and Resource Discovery", T1613]
preconditions:
  accessLevel: user-exec
  kind: Pod
# parameters:
#   TOKEN:
