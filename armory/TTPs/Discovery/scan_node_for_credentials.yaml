name: Search interesting Files
description: Search for files on the FS containing interesting patterns that may indicate credentials or other sensitive information.
tactic: Discovery
techniques: ["T1083", "File and Directory Discovery"]
parameters:
  MOUNT_PATH:
    type: string
    description: the mount path of the host node
    default: "${SRC.MOUNT_PATH}/etc/kubernetes"
  PATTERN:
    type: string
    description: the pattern to search for interesting files
    default: "client-key-data"
  EXCLUDED_DIRS:
    type: stringList
    description: directory names to exclude from the recursive search
    default: ["proc", "sys", "dev"]
procedures:
  - key: grep
    command: >-
      find ${MOUNT_PATH}
      {% for dir in EXCLUDED_DIRS %}
        -type d -name '{{ dir }}' -prune -o
      {% endfor %}
      -type f -exec grep -swIl -e '${PATTERN}' {} \;
preconditions:
  kind: System
  accessLevel: user-exec
effects:
  - sys.files

# dependencies:
#   - type: Kubernetes Pod
#     description: A running Kubernetes pod with a mounted service account token.
indicators:
  - type: File
    description: The kubelet.conf file on the host node
    location: "${MOUNT_PATH}/${PATH}"
references:
  - https://attack.mitre.org/techniques/T1083/
