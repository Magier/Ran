name: Get Nodes
description: Get a list of nodes in the cluster via the API server
tactic: Discovery
techniques: [ "Cloud Infrastructure Discovery", T1580 ]
preconditions:
  # accessLevel: user-read
  rbac:
    - verb: get
      resource: nodes
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
procedures:
  - key: kubectl
    command: >-
      kubectl get nodes ${K8S_AUTH} --output=json
  - key: k8s-request
    k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /api/v1
      resource: nodes
      query: limit=500
      ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
effects:
  - k8s.nodeList
# defend: {}
references:
