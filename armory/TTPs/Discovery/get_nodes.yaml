name: Get Nodes via API Server
description: Get a list of nodes in the cluster via the API server
tactic: Discovery
techniques: ["Cloud Infrastructure Discovery", T1580]
preconditions:
  # accessLevel: user-read
  rbac: 
    - verb: get
      resource: nodes
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
procedures:
  - key: kubectl
    command: >-
      kubectl get nodes --token=${TOKEN} --output=json
  - key: curl
    command: >-
      curl -XGET 
      -H "Accept: application/json"
      -H "User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69"
      -H "Authorization: Bearer ${TOKEN}"
      --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      '${API_SERVER}/api/v1/nodes?limit=500'
effects:
  - k8s.nodeList
# defend: {}
references:
