name: Check Kubeconfig Permissions
description: Query the Kubernetes API for permissions granted to the selected kubeconfig identity
tactic: Discovery
techniques: ["Permission Groups Discovery", "T1069.003"]
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the selected kubeconfig identity
  NS:
    type: Namespace
    description: Namespace in which namespaced permissions should be evaluated
    default: default
preconditions:
  kind: K8sCredential
procedures:
  - key: k8s-client
    command: k8sSelfSubjectRulesReview(${NS})
    isLocal: true
    operation:
      type: self-subject-rules-review
      namespace: ${NS}
  - key: kubectl
    command: >-
      printf '%s\n' '{"apiVersion":"authorization.k8s.io/v1","kind":"SelfSubjectRulesReview","spec":{"namespace":"${NS}"}}'
      | kubectl ${K8S_AUTH} create -f - -o json
    isLocal: true
effects:
  - k8s.SelfSubjectRulesReview
references: []
