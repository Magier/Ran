name: Get Deployments via API Server
description: Get a list of deployments via the API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  # accessLevel: user-read
  rbac:
    - verb: get
      resource: deployments
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get deployments --token=${TOKEN} -n=${NS} -A=${ALL_NS}
      --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /apis/apps/v1
      resource: deployments
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      token: ${TOKEN}
      ca_path: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
effects:
  - k8s.deploymentList
# defend: {}
references:
