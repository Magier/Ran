name: Get Deployments via API Server
description: Get a list of deployments via the API server
tactic: Discovery
techniques: ["Container and Resource Discovery", T1613]
preconditions:
  # accessLevel: user-read
  rbac: 
     - verb: get
       resource: deployments
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: get pods from all namespaces or just the current one
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get deployments --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: curl
    command: >-
      curl -XGET 
      -H "Accept: application/json"
      -H "Authorization: Bearer ${TOKEN}" 
      --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      {{ if .ALL_NS }}
      '${API_SERVER}/api/v1/deployments?limit=500'
      {{ else }}
      '${API_SERVER}/apis/apps/v1/namespaces/${NS}/deployments?limit=500'
      {{ end}}
effects:
  - k8s.deploymentList
# defend: {}
