id: get-clusterrolebindings
name: Get ClusterRoleBindings via API Server
description: Get a list of ClusterRoleBindings via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: clusterrolebindings
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
procedures:
  - key: kubectl
    command: >-
      kubectl get clusterrolebindings ${K8S_AUTH} --output=json
  - key: k8s-request
    k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /apis/rbac.authorization.k8s.io/v1
      resource: clusterrolebindings
      query: limit=500
      use_ca: false
effects:
  - k8s.clusterRoleBindingList
references:
