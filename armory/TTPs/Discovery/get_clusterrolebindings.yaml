id: get-clusterrolebindings
name: Get ClusterRoleBindings
description: Get a list of ClusterRoleBindings via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: clusterrolebindings
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
procedures:
  - key: kubectl
    command: >-
      kubectl get clusterrolebindings --token=${TOKEN} --output=json
  - key: k8s-request
    k8s_request:
      api_server: ${API_SERVER}
      api: /apis/rbac.authorization.k8s.io/v1
      resource: clusterrolebindings
      query: limit=500
      token: ${TOKEN}
      use_ca: false
effects:
  - k8s.clusterRoleBindingList
references:
