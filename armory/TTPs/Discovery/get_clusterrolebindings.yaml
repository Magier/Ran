id: get-clusterrolebindings
name: Get ClusterRoleBindings via API Server
description: Get a list of ClusterRoleBindings via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: clusterrolebindings
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
procedures:
  - key: kubectl
    command: >-
      kubectl get clusterrolebindings --token=${TOKEN} --output=json
  - key: http-request
    tool: http-request
    note: Abstract HTTP request. Runtime selects the concrete HTTP client.
    http_request:
      url: ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/clusterrolebindings?limit=500
      headers:
        Accept: application/json
        User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69
        Authorization: Bearer ${TOKEN}
      use_ca: false
effects:
  - k8s.clusterRoleBindingList
references:
