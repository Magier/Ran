id: list-files
name: List Files
description: List the immediate children of a directory on the target system
tactic: Discovery
techniques: ["Software Discovery", T1518]
parameters:
  DIR:
    type: string
    description: the directory to list files from
    default: "."
preconditions:
  accessLevel: user-exec
  kind: System
procedures:
  - key: ls
    tool: ls
    # The trailing slash follows DIR when it is a symlink. Child symlinks are
    # not dereferenced, so a broken child does not make the listing fail.
    command: ls -laF -- {{ DIR | shell_quote }}/
effects:
  - sys.files
