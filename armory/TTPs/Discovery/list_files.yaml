id: list-files
name: List Files
description: List the immediate children of a directory on the target system
tactic: Discovery
techniques: ["Software Discovery", T1518]
parameters:
  DIR:
    type: string
    description: the directory to list files from
    default: "."
preconditions:
  accessLevel: user-exec
  kind: System
procedures:
  - key: ls
    tool: ls
    # Follow entry symlinks so directory links such as /var/run are expandable.
    command: ls -laFL -- {{ DIR | shell_quote }}
effects:
  - sys.files
