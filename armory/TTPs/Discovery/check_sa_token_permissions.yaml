name: Check Token Permissions
description: Query the K8s API server for the permissions of this provided token
tactic: Discovery
techniques: ["Permission Groups Discovery", "T1069.003"]
# preconditions:
parameters:
  NS:
    type: Namespace
    description: the namespace of the service account
  TOKEN:
    type: ServiceAccount
    description: the token which will be checked
  API_SERVER:
    type: string
    description: the URL of the API server
  CA_PATH:
    type: string
    description: the path to the CA certificate to use for the request
    default: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  USE_CA:
    type: bool
    description: whether to use the CA certificate for the request (true) or skip certificate verification (false)
    default: true
preconditions:
  kind: ServiceAccount
  has-token: true
procedures:
  - key: kubectl
    command: kubectl auth can-i --list --token=${TOKEN}
  - key: curl
    command: >-
      curl -XPOST
            ${API_SERVER}/apis/authorization.k8s.io/v1/selfsubjectrulesreviews
            --cacert ${CA_PATH}
            -H "Authorization: Bearer ${TOKEN}"
            -H "Content-Type: application/json"
            --data '{
              "kind": "SelfSubjectRulesReview",
              "apiVersion": "authorization.k8s.io/v1",
              "spec": { "namespace": "${NS}" }
            }'
  - key: wget
    tool: wget
    note: Busybox' version of `wget` may not support the `ca-certificate` option. No CA must be used instead.
    command: >-
      wget -O- --post-data='{
          "kind": "SelfSubjectRulesReview",
          "apiVersion": "authorization.k8s.io/v1",
          "spec": { "namespace": "${NS}" }
        }'
        --header="Authorization: Bearer ${TOKEN}"
        --header="Content-Type: application/json"
        {% if USE_CA %}
        --ca-certificate=${CA_PATH}
        {% else %}
        --no-check-certificate
        {% endif %}
        ${API_SERVER}/apis/authorization.k8s.io/v1/selfsubjectrulesreviews
effects:
  - k8s.SelfSubjectRulesReview
# effects:
# defend: {}
references:
