name: Check Token Permissions
description: Query the K8s API server for the permissions of the selected identity
tactic: Discovery
techniques: [ "Permission Groups Discovery", "T1069.003" ]
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  NS:
    type: Namespace
    description: the namespace of the service account
  API_SERVER:
    type: string
    description: the URL of the API server
  CA_PATH:
    type: string
    description: the path to the CA certificate to use for the request
    default: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  USE_CA:
    type: bool
    description: whether to use the CA certificate for the request (true) or skip
      certificate verification (false)
    default: true
preconditions:
  kind: ServiceAccount
  has-token: true
procedures:
  - key: kubectl
    command: kubectl auth can-i --list ${K8S_AUTH}
  - http_request:
      authentication: ${K8S_AUTH}
      method: POST
      url: "${API_SERVER}/apis/authorization.k8s.io/v1/selfsubjectrulesreviews"
      headers:
        Content-Type: application/json
      body: '{"kind":"SelfSubjectRulesReview","apiVersion":"authorization.k8s.io/v1","spec":{"namespace":"${NS}"}}'
      use_ca: "${USE_CA}"
      ca_path: "${CA_PATH}"
effects:
  - k8s.SelfSubjectRulesReview
references: []
