name: Check Token Permissions
description: Query the K8s API server for the permissions of this provided token
tactic: Discovery
techniques: [ "Permission Groups Discovery", "T1069.003" ]
parameters:
  NS:
    type: Namespace
    description: the namespace of the service account
  TOKEN:
    type: ServiceAccount
    description: the token which will be checked
  API_SERVER:
    type: string
    description: the URL of the API server
  CA_PATH:
    type: string
    description: the path to the CA certificate to use for the request
    default: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  USE_CA:
    type: bool
    description: whether to use the CA certificate for the request (true) or skip
      certificate verification (false)
    default: true
preconditions:
  kind: ServiceAccount
  has-token: true
procedures:
  - key: kubectl
    command: kubectl auth can-i --list --token=${TOKEN}
  - http_request:
      method: POST
      url: "${API_SERVER}/apis/authorization.k8s.io/v1/selfsubjectrulesreviews"
      headers:
        Authorization: "Bearer ${TOKEN}"
        Content-Type: application/json
      body: "{\"kind\":\"SelfSubjectRulesReview\",\"apiVersion\":\"authorization.k8s.\
        io/v1\",\"spec\":{\"namespace\":\"${NS}\"}}"
      use_ca: "${USE_CA}"
      ca_path: "${CA_PATH}"
effects:
  - k8s.SelfSubjectRulesReview
references: []
