id: get-rolebindings
name: Get RoleBindings via API Server
description: Get a list of RoleBindings via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: rolebindings
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  NS:
    type: Namespace
    description: namespace to get rolebindings from
    default: ${NS}
  ALL_NS:
    type: bool
    description: if true, get rolebindings from all namespaces
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get rolebindings ${K8S_AUTH} -n=${NS} -A=${ALL_NS}
      --output=json
  - key: k8s-request
    k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /apis/rbac.authorization.k8s.io/v1
      resource: rolebindings
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      use_ca: false
effects:
  - k8s.roleBindingList
references:
