id: get-rolebindings
name: Get RoleBindings via API Server
description: Get a list of RoleBindings via the K8s API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: rolebindings
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: namespace to get rolebindings from
    default: ${NS}
  ALL_NS:
    type: bool
    description: if true, get rolebindings from all namespaces
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get rolebindings --token=${TOKEN} -n=${NS} -A=${ALL_NS}
      --output=json
  - key: http-request
    tool: http-request
    note: Abstract HTTP request. Runtime selects the concrete HTTP client.
    http_request:
      url: >-
        {% if ALL_NS %}
        ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/rolebindings?limit=500
        {% else %}
        ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/namespaces/${NS}/rolebindings?limit=500
        {% endif %}
      headers:
        Accept: application/json
        User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69
        Authorization: Bearer ${TOKEN}
      use_ca: false
effects:
  - k8s.roleBindingList
references:
