id: get-gateways
name: Get Gateways via API Server
description: Enumerate Kubernetes Gateway API Gateway resources to identify externally exposed listeners, gateway implementations, and assigned external addresses
tactic: Discovery
techniques: ["Container and Resource Discovery", T1613]
preconditions:
  rbac:
    - verb: list
      resource: gateways
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    default: ""
  NS:
    type: Namespace
    description: namespace to enumerate
    default: ${NS}
  ALL_NS:
    type: bool
    description: enumerate gateways across all namespaces
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get gateways.gateway.networking.k8s.io --token=${TOKEN} -n=${NS} -A=${ALL_NS} --output=json
  - key: curl
    command: >-
      curl -XGET -k
      -H "Accept: application/json"
      -H "User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69"
      -H "Authorization: Bearer ${TOKEN}"
      --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      {% if ALL_NS %}
      '${API_SERVER}/apis/gateway.networking.k8s.io/v1/gateways?limit=500'
      {% else %}
      '${API_SERVER}/apis/gateway.networking.k8s.io/v1/namespaces/${NS}/gateways?limit=500'
      {% endif %}
effects:
  - k8s.gatewaylist
references:
  - https://kubernetes.io/docs/concepts/services-networking/gateway/
  - https://gateway-api.sigs.k8s.io/api-types/gateway/
  - https://attack.mitre.org/techniques/T1613/
