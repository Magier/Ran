id: get-gateways
name: Get Gateways via API Server
description: Enumerate Kubernetes Gateway API Gateway resources to identify
  externally exposed listeners, gateway implementations, and assigned external
  addresses
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  rbac:
    - verb: list
      resource: gateways
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  NS:
    type: Namespace
    description: namespace to enumerate
    default: ${NS}
  ALL_NS:
    type: bool
    description: enumerate gateways across all namespaces
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get gateways.gateway.networking.k8s.io ${K8S_AUTH} -n=${NS}
      -A=${ALL_NS} --output=json
  - key: k8s-request
    k8s_request:
      authentication: ${K8S_AUTH}
      api_server: ${API_SERVER}
      api: /apis/gateway.networking.k8s.io/v1
      resource: gateways
      namespace: ${NS}
      cluster_scoped: ${ALL_NS}
      query: limit=500
      use_ca: false
effects:
  - k8s.gatewaylist
references:
  - https://kubernetes.io/docs/concepts/services-networking/gateway/
  - https://gateway-api.sigs.k8s.io/api-types/gateway/
  - https://attack.mitre.org/techniques/T1613/
