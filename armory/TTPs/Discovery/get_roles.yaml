name: Get Roles via API Server
description: Get a list of ServiceAccounts via the API server
tactic: Discovery
techniques: [ "Container and Resource Discovery", T1613 ]
preconditions:
  # accessLevel: user-read
  rbac:
    - verb: get
      resource: roles
parameters:
  TOKEN:
    type: ServiceAccount
    description: the ServiceAccount token used to authorize this request
    optional: true
    # default: ""
  NS:
    type: Namespace
    description: specify the namespace to get pods from
    default: ${NS}
  ALL_NS:
    type: bool
    description: if true, get roles from all namespaces, otherwise just the current one
    default: false
  CLUSTER_ROLE:
    type: bool
    description: if the role is a cluster role
    default: false
procedures:
  - key: kubectl
    command: >-
      kubectl get roles --token=${TOKEN} {% if not CLUSTER_ROLE %} -n=${NS}
      -A=${ALL_NS} {% endif %} --output=json
  - key: http-request
    tool: http-request
    note: Abstract HTTP request. Runtime selects the concrete HTTP client.
    http_request:
      url: >-
        {% if CLUSTER_ROLE %}
        ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/clusterroles?limit=500
        {% elif ALL_NS %}
        ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/roles?limit=500 {% else
        %}
        ${API_SERVER}/apis/rbac.authorization.k8s.io/v1/namespaces/${NS}/roles?limit=500
        {% endif %}
      headers:
        Accept: application/json
        User-Agent: kubectl/v1.35.0 (linux/amd64) kubernetes/6fc0a69
        Authorization: Bearer ${TOKEN}
      use_ca: false
effects:
  - k8s.roleList
# defend: {}
references:
