name: Create ServiceAccount
description: Create a serviceaccount
tactic: Persistence
techniques:
  - "Scheduled Task/Job: Container Orchestration Job "
  - T1053.007
parameters:
  Name:
    type: string
    default: "default"
    description: the name of the serviceaccount.
  Namespace:
    type: string
    default: ${NS}
    description: the name of the namespace in which the role will be created
  Token:
    type: string
    default: ""
    description: the token used to authenticate to the API server
cmdVariants:
  - key: kubectl
    command: >
      kubectl create serviceaccount {{ .Name }}   --namespace={{ .Namespace}} --token={{ .Token }}
preconditions:
  # kind: ServiceAccount
  accessLevel: can-create ServiceAccounts
effects:
  - "k8s.ServiceAccount"
