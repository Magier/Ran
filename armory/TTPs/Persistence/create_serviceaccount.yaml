name: Create ServiceAccount
description: Create a serviceaccount
tactic: Persistence
techniques:
  - "Create Account: Local Account"
  - T1136.001
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  Name:
    type: string
    default: default
    description: the name of the serviceaccount.
  Namespace:
    type: string
    default: ${NS}
    description: the name of the namespace in which the serviceaccount will be created
procedures:
  - key: kubectl
    command: >
      kubectl create serviceaccount {{ Name }}   --namespace={{ Namespace }} ${K8S_AUTH}
preconditions:
  # kind: ServiceAccount
  rbac: 
    - verb: create
      resource: serviceaccounts
effects:
  - "k8s.ServiceAccount"
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1136/001/
