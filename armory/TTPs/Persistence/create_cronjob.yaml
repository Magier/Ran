name: Create CronJob
description: Create a cronjob that runs a command at a specified schedule
tactic: Persistence
techniques:
  - "Scheduled Task/Job: Container Orchestration Job "
  - T1053.007
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  Name:
    type: string
    default: "maintenance"
    description: the name of the cronjob. The name must be RFC 1123 compliant.
  IMAGE:
    type: string
    default: "busybox"
    description: the image used by the cronjob
  COMMAND:
    type: string
    default: "/bin/sh -c - date;"
    description: the command executed when starting the cronjob
  SCHEDULE:
    type: string
    default: "* * * * *"
    description: the token used to authenticate to the API server
  NAMESPACE:
    type: Namespace
    default: ${NS}
    description: the name of the namespace in which the role will be created
procedures:
  - key: kubectl
    command: >
      kubectl create cronjob ${NAME} --image=${IMAGE} --schedule="${SCHEDULE}" ${K8S_AUTH} --namespace=${NAMESPACE} -- ${COMMAND}
preconditions:
  # kind: ServiceAccount
  rbac: 
    - verb: create
      resource: cronjobs
effects:
  - create k8s.CronJob
cleanup: 
  command: delete k8s.CronJob
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://github.com/Container-Security-Training/Kubecon-EU-25
