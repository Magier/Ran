name: Disable PSA on Namespace
description: Disables Pod Security Admission on a namespace by overwriting the enforced PodSecurityStandard to `privileged`.
tactic: Defense Evasion
techniques: ["Impair Defenses", "T1562"]
parameters:
  NAMESPACE:
    type: string
    default: ${TARGET}
    description: the name of the namespace to disable Pod Security Admission on
procedures:
  - key: kubectl
    command: kubectl label ns ${NAMESPACE} pod-security.kubernetes.io/enforce=privileged --overwrite
effects:
  - k8s.Namespace.enforcedPSS=privileged
preconditions:
  kind: Namespace
  rbac: "update namespace"
