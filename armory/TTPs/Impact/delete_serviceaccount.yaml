name: Delete ServiceAccount
description: Delete a serviceaccount
tactic: Impact
techniques:
  - Account Access Removal
  - T1531
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  Name:
    type: string
    default: ${TARGET}
    description: the name of the serviceaccount to delete
  Namespace:
    type: string
    default: ${NS}
    description: the name of the namespace of the serviceaccount
procedures:
  - key: kubectl
    command: >
      kubectl delete serviceaccount {{ Name }} --namespace={{ Namespace }} ${K8S_AUTH}
preconditions:
  kind: ServiceAccount
  rbac: 
    - verb: delete
      resource: serviceaccounts
effects:
  - "delete k8s.ServiceAccount"
