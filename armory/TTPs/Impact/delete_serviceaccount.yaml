name: Delete ServiceAccount
description: Delete a serviceaccount
tactic: Impact
techniques:
  - Account Access Removal
  - T1531
parameters:
  Name:
    type: string
    default: ${TARGET}
    description: the name of the serviceaccount to delete
  Namespace:
    type: string
    default: ${NS}
    description: the name of the namespace of the serviceaccount
  Token:
    type: string
    default: ""
    description: the token used to authenticate to the API server
procedures:
  - key: kubectl
    command: >
      kubectl delete serviceaccount {{ .Name }} --namespace={{ .Namespace}} --token={{ .Token }}
preconditions:
  kind: ServiceAccount
  rbac: delete ServiceAccounts
effects:
  - "delete k8s.ServiceAccount"
