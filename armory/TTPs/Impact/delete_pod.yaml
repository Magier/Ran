name: Delete Pod
description: Delete a pod
tactic: Impact
techniques:
  - Service Stop
  - T1489
parameters:
  Name:
    type: Pod
    default: ${TARGET}
    description: the name of the pod to delete
  Namespace:
    type: Namespace
    default: ${NS}
    description: the name of the namespace of the pod
  Token:
    type: ServiceAccount
    description: the token used to authenticate to the API server
procedures:
  - key: kubectl
    command: >
      kubectl delete pod {{ .Name }}  --namespace={{ .Namespace}} --token={{ .Token }}
preconditions:
  kind: Pod
  rbac: 
    - verb: delete
      resource: pods
effects:
  - "delete k8s.Pod"
