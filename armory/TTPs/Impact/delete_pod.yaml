name: Delete Pod
description: Delete a pod
tactic: Impact
techniques:
  - Service Stop
  - T1489
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  Namespace:
    type: Namespace
    default: ${NS}
    description: the name of the namespace of the pod
  Name:
    type: Pod
    default: ${TARGET}
    description: the name of the pod to delete
procedures:
  - key: kubectl
    command: >
      kubectl delete pod {{ Name }}  --namespace={{ Namespace }} ${K8S_AUTH}
preconditions:
  kind: Pod
  rbac: 
    - verb: delete
      resource: pods
effects:
  - "delete k8s.Pod"
