name: Create Rolebinding
description: Bind a given RBAC role to an existing service account
tactic: Privilege Escalation
techniques:
  - "Account Manipulation: Additional Container Cluster Roles"
  - T1098.006
parameters:
  K8S_AUTH:
    type: K8sAuth
    description: the Kubernetes identity selected by Authenticate As
  SUBJECT:
    type: ServiceAccount
    default: ${TARGET}
    description: the name of the serviceaccount, user or group to which the role will be bound
  NAMESPACE:
    type: Namespace
    default: ${NS}
    description: the name of the namespace in which the role will be created
  ROLE_NAME:
    type: Role
    default: nsadmin
    description: the name of the service account to which the role will be bound
  BINDING_NAME:
    type: string
    default: ${SUBJECT}-${ROLE_NAME}
    description: the name of the service account to which the role will be bound
procedures:
  - key: kubectl
    command: >
      kubectl create rolebinding ${BINDING_NAME} --namespace=${NAMESPACE} --role=${ROLE_NAME} --serviceaccount=${NAMESPACE}:${SUBJECT} ${K8S_AUTH}
preconditions:
  kind: ServiceAccount
  rbac: 
    - verb: create
      resource: rolebindings
effects:
  - create k8s.RoleBinding
  - k8s.Role
  - k8s.ServiceAccount
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://github.com/Container-Security-Training/Kubecon-EU-25
