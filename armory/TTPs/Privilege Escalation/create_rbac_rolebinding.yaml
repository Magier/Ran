name: Create Rolebinding
description: Bind a given RBAC role to an existing service account
tactic: Privilege Escalation
techniques:
  - "Account Manipulation: Additional Container Cluster Roles"
  - T1098.006
parameters:
  SUBJECT:
    type: string
    default: ${TARGET}
    description: the name of the serviceaccount, user or group to which the role will be bound
  NAMESPACE:
    type: string
    default: ${NS}
    description: the name of the namespace in which the role will be created
  TOKEN:
    type: string
    default: ""
    description: the token used to authenticate to the API server
  ROLE_NAME:
    type: string
    default: nsadmin
    description: the name of the service account to which the role will be bound
  BINDING_NAME:
    type: string
    default: ${SUBJECT}-${ROLE_NAME}
    description: the name of the service account to which the role will be bound
cmdVariants:
  - key: kubectl
    # export TOKEN=${TOKEN}
    command: >
      kubectl create rolebinding ${BINDING_NAME} --namespace=${NAMESPACE} --role=${ROLE_NAME} --serviceaccount=${NAMESPACE}:${SUBJECT} --token=${TOKEN}
preconditions:
  kind: ServiceAccount
  accessLevel: can-create rolebinding
parser: newRoleBinding
effects:
  - "RoleBinding(${BINDING_NAME}, Role(${ROLE_NAME}), ServiceAccount(${SERVICEACCOUNT}))"
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://github.com/Container-Security-Training/Kubecon-EU-25
