name: Escape container via NSenter 🚧
description: Container escape via the nsenter built-in linux program that allows executing a binary into another namespace.
tactic: "Privilege Escalation"
techniques: ["Escape to Host", T1611]
preconditions:
  # kind: Session
  "Pod.securityContext.privileged": true
  accessLevel: "user-exec"
effects: 
  - container.escape(sys)
procedures:
  - key: nsenter
    command: nsenter --target 1 --mount --uts --ipc --net --pid ${CMD}
defend:
  - tactic: detect
    id: D3-SCA
    syscall: setns
  - tactic: detect
    id: D3-PSA
    process_creation: nsenter
refernces:
  - https://attack.mitre.org/techniques/T1611/
  - "[https://kubehound.io/reference/attacks/CE_NSENTER](KubeHound CE_NSENTER)"
