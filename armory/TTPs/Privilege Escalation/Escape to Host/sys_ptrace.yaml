name: Escape container via ptrace 🚧
description: Abuse the legitimate OS debugging mechanisms to escape the container via attaching to a node process.
status: disabled
tactic: "Privilege Escalation"
techniques: ["Escape to Host", T1611]
preconditions:
  kind: Session
  "Pod.securityContext.hostPID": true
  "Container.securityContext.capabilities": [SYS_PTRACE, SYS_ADMIN]
effects: []
parameters:
  PID:
    type: string
    description: the target process ID to attach to
procedures:
  - key: gdp
    command: |
      gdb -p ${PID}
      MODULE=ptrace.ko
defend:
  # - tactic: detect
  #   id: D3-SCA
  #   syscall: setns
  # - tactic: detect
  #   id: D3-PSA
  #   process_creation: nsenter
refernces:
  - https://attack.mitre.org/techniques/T1611/
  - https://kubehound.io/reference/attacks/CE_SYS_PTRACE/
