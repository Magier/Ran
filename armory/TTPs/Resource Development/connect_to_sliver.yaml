name: Connect to C2
description: Connect to another C2 server for advanced C2 capabilities.
tactic: Resource Development
techniques: ["Obtain Capabilities"]
parameters:
  CONFIG_PATH:
    type: string
    default: "sliver_cfg.json"
    description: | 
      The path to the Sliver client configuration.
      This configuration has to be generated by the Sliver server.
      See [Sliver documentation](https://sliver.sh/docs?name=Multi-player+Mode) for more details.
    required: false
preconditions:
  kind: C2
  c2.name: Ran
procedures:
  - key: sliver
    tool: sliver
    command: c2.connect
effects: ["operate c2"]
