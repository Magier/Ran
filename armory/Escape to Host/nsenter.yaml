name: Escape container via NSenter
description: Catch incoming shells
tactic: "Privilege Escalation"
techniques: ["Escape to Host"]
preconditions:
  "kind": Session
  "Pod.securityContext.privileged": true
effects: []
command: "EscapeHost"
cmd: "nsenter --target 1 --mount --uts --ipc --net --pid"
defend:
  - tactic: detect
    id: D3-SCA
    syscall: setns
  - tactic: detect
    id: D3-PSA
    process_creation: nsenter
refernces:
  - "[https://kubehound.io/reference/attacks/CE_NSENTER](KubeHound CE_NSENTER)"
